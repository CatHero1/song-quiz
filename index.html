<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one stage column on a bright floor. Each look sets the surfaces and a fixed --brand;
   the selected era/genre sets --a1/--a2 for highlights (tiles, ring, visualizer, answers). */
:root {
  /* Sky (default): light blue on white */
  --floor: #f3faff;
  --glow-1: #bfe7ff;
  --glow-2: #d9f1ff;
  --card: #ffffff;
  --card-hi: #eef7fd;
  --edge: #cbe3f3;
  --edge-deep: #9ccbe9;
  --border-w: 2px;
  --text: #0b2540;
  --muted: #557590;
  --on-accent: #0b2540;
  --brand: #1fb2ff;
  --brand-deep: #0b7fc0;
  --right: #12b76a;
  --wrong: #f04438;
  --scrim: rgba(11, 37, 64, .35);
  --on-brand: #ffffff;
  --cta-text-shadow: 0 2px 0 var(--brand-deep);
  --gold-bg: #fff6cc;
  --gold-edge: #e0a800;
  --gold-deep: #c08f00;
  --gold-text: #a87800;
  --a1: #ff2e88;   /* set from the selected era/genre */
  --a2: #00b4ff;
  --font-marquee: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-look="lemon"] {
  --floor: #ffe14d;
  --glow-1: #fff3a8;
  --glow-2: #ffd21f;
  --card: #ffffff;
  --card-hi: #fff8d6;
  --edge: #161616;
  --edge-deep: #161616;
  --border-w: 3px;
  --text: #161616;
  --muted: #5a4d12;
  --on-accent: #161616;
  --brand: #ff2e88;
  --brand-deep: #161616;
  --scrim: rgba(22, 22, 22, .45);
}
:root[data-look="bubblegum"] {
  --floor: #fff0f7;
  --glow-1: #ffc9e2;
  --glow-2: #c8ecff;
  --card: #ffffff;
  --card-hi: #fff4f9;
  --edge: #f6cfe1;
  --edge-deep: #eaa3c4;
  --text: #3a0f2a;
  --muted: #8a5272;
  --on-accent: #3a0f2a;
  --brand: #ff3d95;
  --brand-deep: #c4166a;
  --scrim: rgba(58, 15, 42, .35);
}

/* Category rows (Spotify-style) */
.row-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.row-nav { display: flex; gap: 6px; }
@media (hover: none) { .row-nav { display: none; } }
.nav-btn {
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 3px 0 var(--edge-deep);
}
.nav-btn .ico { width: 18px; height: 18px; }
.carousel {
  display: grid; grid-auto-flow: column; grid-auto-columns: clamp(128px, 36vw, 146px); gap: 14px;
  overflow-x: auto; scroll-snap-type: x proximity; scroll-padding-inline: 4px;
  padding: 8px 4px 10px; margin-inline: -4px; scrollbar-width: none;
}
.carousel::-webkit-scrollbar { display: none; }
.cat { display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; text-align: left; scroll-snap-align: start; min-width: 0; }
.cat-art {
  position: relative; display: block; aspect-ratio: 1; border-radius: 12px; overflow: hidden; max-width: 100%;
  background: linear-gradient(150deg, var(--c1), color-mix(in srgb, var(--c2) 70%, #000));
  box-shadow: 0 4px 0 color-mix(in srgb, var(--c2) 45%, #000); transition: transform .15s, box-shadow .15s;
}
.watermark { position: absolute; right: -14%; top: -10%; width: 78%; height: 78%; fill: none; stroke: rgba(255,255,255,.3); stroke-width: 1.5; transform: rotate(-12deg); }
.cat-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .5s; }
.cat-img.on { opacity: 1; }
.mosaic { display: grid; grid-template-columns: 1fr 1fr; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cat-label {
  position: absolute; left: 8px; bottom: 9px; padding: 1px 6px; border-radius: 4px; max-width: 58%;
  background: color-mix(in srgb, var(--c1) 70%, #fff); color: #111; font-weight: 700; font-size: 13px; line-height: 1.3;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cat-badge {
  position: absolute; right: 8px; bottom: 8px; padding: 0 6px; border-radius: 4px;
  background: color-mix(in srgb, var(--c1) 70%, #fff); color: #111; font-family: var(--font-marquee); font-size: 19px; line-height: 1.25;
}
.tick {
  position: absolute; top: 7px; right: 7px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  background: #fff; color: #111; box-shadow: 0 2px 6px rgba(0,0,0,.3); opacity: 0; transform: scale(.5); transition: opacity .15s, transform .15s;
}
.tick .ico { width: 16px; height: 16px; stroke-width: 3; }
.cat[aria-pressed="true"] .tick, .artist[aria-pressed="true"] .tick { opacity: 1; transform: scale(1); }
.cat[aria-pressed="true"] .cat-art { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--floor), 0 0 0 6px var(--text), 0 7px 0 3px color-mix(in srgb, var(--c2) 45%, #000); }
.cat-name { font-weight: 700; font-size: 15px; line-height: 1.2; }
.cat-sub { color: var(--muted); font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Artists (collapsible) */
.fold {
  display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; border-radius: 16px; text-align: left;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
}
.fold > .ico { color: var(--brand); }
.fold-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fold-text b { font-size: 17px; }
.fold-text span { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev .ico { transition: transform .2s; }
.fold[aria-expanded="true"] .chev .ico { transform: rotate(180deg); }
.fold-panel { display: flex; flex-direction: column; gap: 10px; }
.search {
  display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 14px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
}
.search:focus-within { border-color: var(--brand); }
.search .ico { color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 12px 0; font-size: 16px; font-weight: 600; }
.search input:focus-visible { outline: none; }
.carousel.artists { grid-auto-columns: clamp(96px, 26vw, 112px); }
.artist { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0; border: 0; background: none; scroll-snap-align: start; min-width: 0; }
.artist-pic {
  position: relative; width: 100%; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center;
  background: var(--card-hi); font-family: var(--font-marquee); font-size: 28px; color: var(--muted);
  box-shadow: 0 4px 0 var(--edge-deep); transition: transform .15s, box-shadow .15s;
}
.artist-pic img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.artist-pic .tick { top: 0; right: 0; }
.artist[aria-pressed="true"] .artist-pic { transform: translateY(-3px); box-shadow: 0 0 0 3px var(--floor), 0 0 0 6px var(--text); }
.artist-name { font-weight: 600; font-size: 14px; text-align: center; line-height: 1.2; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sp-foot { margin: 0; color: var(--muted); font-size: 14px; }
.switch { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.switch span { display: flex; flex-direction: column; line-height: 1.3; }
.switch small { color: var(--muted); font-size: 13px; }
.switch input {
  appearance: none; -webkit-appearance: none; margin: 0; flex: none; position: relative; cursor: pointer;
  width: 46px; height: 28px; border-radius: 999px; background: var(--edge); transition: background .2s;
}
.switch input::after {
  content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s;
}
.switch input:checked { background: var(--brand); }
.switch input:checked::after { transform: translateX(18px); }
.switch input:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
.link-btn { padding: 0; border: 0; background: none; font: inherit; font-weight: 600; color: var(--text); text-decoration: underline; }

/* Heardle mode */
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tiles.two .tile { justify-content: center; }
.h-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.h-rows li {
  min-height: 42px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px; min-width: 0;
  background: var(--card); border: var(--border-w) solid var(--edge); font-weight: 600; font-size: 15px;
}
.h-rows li .ico { width: 18px; height: 18px; }
.h-rows .h-t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-rows small { flex: none; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: color-mix(in srgb, #f5b800 25%, var(--card)); }
.h-rows li.h-empty { background: transparent; border-style: dashed; }
.h-rows li.h-skip { color: var(--muted); }
.h-rows li.h-wrong .ico { color: var(--wrong); }
.h-rows li.h-artist, .h-rows li.h-title { border-color: #e0a800; }
.h-rows li.h-artist .ico, .h-rows li.h-title .ico { color: #e0a800; }
.h-rows li.h-right { border-color: var(--right); background: color-mix(in srgb, var(--right) 15%, var(--card)); }
.h-rows li.h-right .ico { color: var(--right); }
.h-player { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.h-bar { position: relative; width: 100%; height: 14px; border-radius: 999px; overflow: hidden; background: var(--card); border: var(--border-w) solid var(--edge); }
.h-unlocked { position: absolute; inset: 0 auto 0 0; background: color-mix(in srgb, var(--a1) 25%, var(--card)); transition: width .3s; }
.h-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, var(--a1), var(--a2)); }
.h-bar i { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--edge); }
.h-bar.full i { display: none; }
.h-times { width: 100%; display: flex; justify-content: space-between; margin-top: -4px; color: var(--muted); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.h-controls { width: 100%; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 16px; }
.h-step { justify-self: start; padding: 8px 14px; font-size: 15px; }
.h-step .ico { width: 16px; height: 16px; }
.h-play {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand); color: var(--on-brand); border: var(--border-w) solid var(--brand-deep); box-shadow: 0 6px 0 var(--brand-deep);
  transition: transform .08s, box-shadow .08s;
}
.h-play svg { width: 30px; height: 30px; fill: currentColor; }
.h-play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-deep); }
.h-guess { display: flex; flex-direction: column; gap: 12px; }
.h-search { position: relative; }
.h-search .typed { width: 100%; }
.h-list {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 8px); z-index: 15; list-style: none; margin: 0; padding: 6px;
  max-height: 320px; overflow-y: auto; border-radius: 14px; background: var(--card); border: var(--border-w) solid var(--edge);
  box-shadow: 0 -8px 30px rgba(0,0,0,.16);
}
.h-list button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 10px; background: none; text-align: left; }
.h-list button:hover, .h-list li[aria-selected="true"] button { background: var(--card-hi); }
.h-list img, .h-noart { width: 36px; height: 36px; border-radius: 6px; flex: none; background: var(--card-hi); object-fit: cover; }
.h-list .round { border-radius: 50%; }
.h-txt { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.h-txt b, .h-txt span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.h-txt span { color: var(--muted); font-size: 14px; }
.h-actions { display: flex; gap: 10px; align-items: center; }
.h-actions .pill { flex: none; }
.h-actions .cta { flex: 1; padding: 14px; font-size: 18px; }
.h-grid { margin: 0; text-align: center; font-size: 24px; letter-spacing: 2px; }

/* Dark themes */
:root[data-look="neon"], :root[data-look="vinyl"], :root[data-look="lagoon"] {
  --gold-bg: #2e2508; --gold-edge: #ffbf00; --gold-deep: #6b5000; --gold-text: #ffcf40;
  --border-w: 2px;
  color-scheme: dark;
}
:root[data-look="neon"] {
  --floor: #06060a;
  --glow-1: rgba(255, 46, 136, .24);
  --glow-2: rgba(0, 214, 255, .18);
  --card: #111118;
  --card-hi: #1a1a24;
  --edge: #2b2b36;
  --edge-deep: #000000;
  --text: #f7f7ff;
  --muted: #9d9db4;
  --brand: #ff2e88;
  --brand-deep: #8c0045;
  --on-brand: #ffffff;
  --scrim: rgba(0, 0, 0, .65);
}
:root[data-look="neon"] .marquee-text { text-shadow: 3px 3px 0 var(--brand), 0 0 22px color-mix(in srgb, var(--brand) 70%, transparent); }
:root[data-look="neon"] .cta { box-shadow: 0 7px 0 var(--brand-deep), 0 0 34px color-mix(in srgb, var(--brand) 60%, transparent); }
:root[data-look="neon"] .tile[aria-pressed="true"] { box-shadow: 0 5px 0 #000, 0 0 26px color-mix(in srgb, var(--a1) 60%, transparent); }
:root[data-look="neon"] .disc { box-shadow: 0 6px 0 #000, 0 0 50px color-mix(in srgb, var(--a1) 45%, transparent); }
:root[data-look="vinyl"] {
  --floor: #16110d;
  --glow-1: rgba(255, 166, 0, .16);
  --glow-2: rgba(255, 90, 60, .12);
  --card: #221a14;
  --card-hi: #2c221a;
  --edge: #3f3127;
  --edge-deep: #0b0705;
  --text: #fbefdf;
  --muted: #b59f88;
  --brand: #ffad1f;
  --brand-deep: #9a5c00;
  --on-brand: #1d1206;
  --cta-text-shadow: none;
  --scrim: rgba(8, 5, 3, .6);
}
:root[data-look="lagoon"] {
  --floor: #03222a;
  --glow-1: rgba(25, 227, 199, .18);
  --glow-2: rgba(255, 107, 107, .14);
  --card: #07323c;
  --card-hi: #0b3e4a;
  --edge: #155462;
  --edge-deep: #011418;
  --text: #ecfffb;
  --muted: #8dc4bc;
  --brand: #19e3c7;
  --brand-deep: #08806f;
  --on-brand: #03222a;
  --cta-text-shadow: none;
  --scrim: rgba(1, 15, 19, .6);
}

/* Theme menu */
.theme-menu { position: relative; }
.theme-menu .small-btn { padding-inline: 11px; }
.theme-panel {
  display: none; position: absolute; right: 0; top: 100%; z-index: 20; padding-top: 10px; width: min(300px, calc(100vw - 32px));
}
.theme-menu.open .theme-panel { display: block; }
@media (hover: hover) { .theme-menu:hover .theme-panel, .theme-menu:focus-within .theme-panel { display: block; } }
.theme-card {
  display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 6px 0 var(--edge-deep), 0 16px 40px rgba(0,0,0,.18);
}
.theme-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.theme-opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 12px;
  background: transparent; border: var(--border-w) solid transparent; font-weight: 600; font-size: 14px;
}
.theme-opt:hover { background: var(--card-hi); }
.theme-opt[aria-pressed="true"] { border-color: var(--brand); background: var(--card-hi); }
.theme-dot { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; border: 2px solid var(--edge); }
.theme-dot i { position: absolute; }
.theme-dot i:nth-child(1) { inset: 0; }
.theme-dot i:nth-child(2) { inset: 50% 0 0 0; }
.theme-dot i:nth-child(3) { width: 16px; height: 16px; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(255,255,255,.7); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(60% 45% at 8% -8%, var(--glow-1), transparent 70%),
    radial-gradient(55% 40% at 105% 20%, var(--glow-2), transparent 70%),
    radial-gradient(60% 40% at 50% 115%, color-mix(in srgb, var(--a1) 14%, transparent), transparent 70%),
    var(--floor);
  background-attachment: fixed;
  color: var(--text);
  font: 500 16px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
}
.stage { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
button:disabled { cursor: not-allowed; }
svg.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Marquee type: solid ink with a hard offset shadow, like a sticker */
.marquee-text {
  font-family: var(--font-marquee); font-weight: 400; letter-spacing: -.01em; line-height: 1.02; margin: 0;
  color: var(--text); text-shadow: 3px 3px 0 var(--brand);
  text-wrap: balance;
}
.section-title { font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.tools { display: flex; gap: 8px; align-items: center; flex: none; }
/* Home: the big logo gets its own line, with the buttons in a row above it. */
.topbar.home { flex-wrap: wrap; row-gap: 4px; }
.topbar.home .tools { order: 1; margin-left: auto; }
.topbar.home .brand { order: 2; flex-basis: 100%; }
.logo { font-size: 20px; }
.brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand.home { flex-direction: column; align-items: flex-start; gap: 6px; }
.logo { white-space: nowrap; }
.ver { padding: 2px 8px; border-radius: 999px; background: var(--card); border: var(--border-w) solid var(--edge); color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; flex: none; }
.logo.home { font-size: clamp(38px, 11vw, 60px); padding-top: 6px; text-shadow: 4px 4px 0 var(--brand); }
.small-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
  font-weight: 700; font-size: 15px; transition: transform .08s, box-shadow .08s;
}
.small-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-deep); }

/* 3D tiles (era/genre/mode/clip/look choices) */
.tile {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; min-width: 0;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 5px 0 var(--edge-deep);
  font-weight: 600; font-size: 16px; text-align: left; transition: transform .08s, box-shadow .08s, border-color .15s, background .15s;
}
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge-deep); }
.tile[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--a1) 80%, var(--edge));
  background: color-mix(in srgb, var(--a1) 18%, var(--card));
  box-shadow: 0 5px 0 color-mix(in srgb, var(--a1) 70%, #000), 0 8px 22px color-mix(in srgb, var(--a1) 30%, transparent);
}
:root[data-look="lemon"] .tile[aria-pressed="true"] { background: var(--a1); border-color: var(--edge); box-shadow: 0 5px 0 var(--edge-deep); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 10px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.three .tile { justify-content: center; }

.block { display: flex; flex-direction: column; gap: 12px; }

/* Player tiles */
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ptile {
  --pc: var(--brand);
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 18px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 16%, var(--card)), var(--card) 70%);

}
:root[data-look="lemon"] .ptile { border-color: var(--edge); box-shadow: 0 5px 0 var(--edge-deep); }
.ptile:focus-within { box-shadow: 0 5px 0 color-mix(in srgb, var(--pc) 55%, var(--edge-deep)), 0 0 0 4px color-mix(in srgb, var(--pc) 30%, transparent); }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center;

}

  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 66px; border-radius: 18px;

}

/* Big CTA */
.cta {
  padding: 18px; border-radius: 20px; border: var(--border-w) solid var(--brand-deep); color: var(--on-brand);

.ghost-btn {
  padding: 16px 18px; border-radius: 20px; background: var(--card); border: var(--border-w) solid var(--edge);
  box-shadow: 0 6px 0 var(--edge-deep); font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s, box-shadow .08s;
}
.ghost-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--edge-deep); }
.actions { display: flex; gap: 12px; }
.actions > * { flex: 1; }
.error { color: var(--wrong); font-weight: 600; margin: 0; }
.hint { color: var(--muted); margin: 0; font-size: 15px; }
.center { text-align: center; }


/* Leaderboard */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 8px; }
.lb {
  --pc: var(--brand);

  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep); font-weight: 600;
}
.lb .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
.lb .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb.now { border-color: var(--pc); box-shadow: 0 4px 0 color-mix(in srgb, var(--pc) 70%, #000); }
.lb.lead-player .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold-edge) 60%, transparent); }
.lb.scored { animation: scored 1.3s ease-out; }
@keyframes scored { 0% { transform: scale(1); } 15% { transform: scale(1.06); } 100% { transform: scale(1); } }
.odo { display: inline-flex; font-family: var(--font-marquee); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.dig { display: inline-block; height: 1em; width: .7em; overflow: hidden; transition: width .4s, opacity .4s; }
.dig.lead { width: 0; opacity: 0; }
.strip { display: flex; flex-direction: column; transform: translateY(calc(var(--d) * -1em)); transition: transform 1.1s cubic-bezier(.2, .9, .25, 1); }
.strip i { display: block; height: 1em; font-style: normal; text-align: center; }
.pop {
  position: absolute; right: 10px; top: -10px; font-family: var(--font-marquee); font-size: 18px; color: var(--right);
  text-shadow: 2px 2px 0 color-mix(in srgb, var(--right) 30%, #000); pointer-events: none; animation: pop 1.5s ease-out forwards;
}
@keyframes pop { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 20% { opacity: 1; transform: translateY(-6px) scale(1.15); } 100% { opacity: 0; transform: translateY(-34px) scale(1); } }

/* Turn header */
.turn-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.round-pill { font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.turn-name { font-family: var(--font-marquee); font-size: clamp(30px, 9vw, 46px); line-height: 1.05; color: var(--text); text-shadow: 3px 3px 0 var(--pc); overflow-wrap: anywhere; }
.double {
  padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  background: #ffbf00; color: #2a1d00; border: var(--border-w) solid color-mix(in srgb, #ffbf00 60%, #000);
}

/* Clip player */
.deck { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.clip-btn { position: relative; width: min(200px, 56vw); aspect-ratio: 1; border: 0; padding: 0; background: none; border-radius: 50%; max-width: 100%; }
.clip-btn svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .track { fill: none; stroke: var(--edge); stroke-width: 6; }

.disc {
  position: absolute; inset: 10%; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 50% 30%, var(--card), var(--card-hi) 80%);

}
.disc .count { font-family: var(--font-marquee); font-size: clamp(40px, 13vw, 58px); line-height: 1; color: var(--text); text-shadow: 3px 3px 0 var(--a1); font-variant-numeric: tabular-nums; }
.disc img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.disc .answer-count { display: flex; flex-direction: column; align-items: center; }
.disc .count-label { margin-top: 4px; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.answering .disc { border-color: var(--a2); }
.next-in { margin: 0; text-align: center; color: var(--muted); font-weight: 600; font-size: 15px; }
.disc .play { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; letter-spacing: .08em; font-size: 14px; color: var(--muted); }
.disc .play svg { width: 46px; height: 46px; fill: var(--a1); stroke: none; }
.playing .disc { border-color: var(--a1); box-shadow: 0 6px 0 color-mix(in srgb, var(--a1) 70%, #000), 0 0 44px color-mix(in srgb, var(--a1) 40%, transparent); }
.viz { width: 100%; height: 64px; display: block; }


/* Play again / Skip */
.pills { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.vol { display: flex; align-items: center; gap: 10px; width: min(260px, 100%); color: var(--muted); }
.vol .ico { width: 20px; height: 20px; }
.vol input {
  -webkit-appearance: none; appearance: none; flex: 1; min-width: 0; height: 6px; margin: 0; border-radius: 999px; cursor: pointer;

}
.vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--card); border: 3px solid var(--a1); box-shadow: 0 2px 4px rgba(0,0,0,.2); }
.vol input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--card); border: 3px solid var(--a1); }
.vol input:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
.get-ready { min-height: 85vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
.get-ready .big { font-family: var(--font-marquee); font-size: clamp(110px, 38vw, 180px); line-height: 1; color: var(--text); text-shadow: 6px 6px 0 var(--a1); }
.get-ready .big.tick-in { animation: count-pop .5s ease-out; }
@keyframes count-pop { 0% { transform: scale(1.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
  font-weight: 600; font-size: 16px; transition: transform .08s, box-shadow .08s, opacity .2s;
}
.pill .ico { width: 18px; height: 18px; }
.pill:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-deep); }
.pill:disabled { opacity: .45; }
.count-badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--a1); color: #fff; font-size: 13px; font-weight: 700; }

/* Answer: mic first, typing second */
.answer { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.mic {
  width: 78px; height: 78px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand); color: var(--on-brand); border: var(--border-w) solid var(--brand-deep); box-shadow: 0 6px 0 var(--brand-deep);
  transition: transform .08s, box-shadow .08s;
}
.mic .ico { width: 32px; height: 32px; }
.mic:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-deep); }

@keyframes pulse {
  0% { box-shadow: 0 6px 0 var(--brand-deep), 0 0 0 0 color-mix(in srgb, var(--brand) 55%, transparent); }

}
.mic-status { margin: 0; font-weight: 600; font-size: 17px; min-height: 1.45em; max-width: 40ch; overflow-wrap: anywhere; }
.mic-status b { color: var(--text); }
.type-row { display: flex; gap: 8px; width: 100%; }
.typed {
  flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; background: var(--card); border: var(--border-w) solid var(--edge);
  box-shadow: 0 4px 0 var(--edge-deep); font-size: 16px; font-weight: 600;
}

  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
}

.overrule { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px; }
.overrule .pill { font-size: 15px; }
.verdicts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.verdicts li { display: flex; gap: 8px; align-items: center; font-size: 16px; overflow-wrap: anywhere; }
.verdicts li.ok .ico { color: var(--right); }
.verdicts li.no .ico { color: var(--wrong); }

/* Result card */
.result {
  display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 22px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--a1) 14%, var(--card)), var(--card) 70%);
  border: var(--border-w) solid color-mix(in srgb, var(--a1) 55%, var(--edge));
  box-shadow: 0 6px 0 color-mix(in srgb, var(--a1) 45%, var(--edge-deep));
}
:root[data-look="lemon"] .result { border-color: var(--edge); box-shadow: 0 6px 0 var(--edge-deep); }
.song { display: flex; gap: 14px; align-items: center; }
.song img { width: 80px; height: 80px; border-radius: 12px; flex: none; background: var(--card-hi); border: var(--border-w) solid var(--edge); }
.song .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.guess-time { margin: -10px 0 0; text-align: center; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.earned.zero { color: var(--muted); text-shadow: none; font-size: 22px; }

.standings { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }

  display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card);
  border: var(--border-w) solid var(--edge); box-shadow: 0 5px 0 var(--edge-deep);
}
.standings li:first-child { background: var(--gold-bg); border-color: var(--gold-edge); box-shadow: 0 5px 0 var(--gold-deep); }
:root[data-look="lemon"] .standings li:first-child { border-color: var(--edge); box-shadow: 0 5px 0 var(--edge-deep); }
.standings .pos { font-family: var(--font-marquee); font-size: 22px; width: 28px; color: var(--muted); }
.standings li:first-child .pos { color: var(--gold-text); }
.standings .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 18px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 10px; }
.standings .nm::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
.standings .pts { font-family: var(--font-marquee); font-size: 22px; font-variant-numeric: tabular-nums; }

/* Loading */
.loading { display: grid; place-items: center; gap: 18px; padding: 70px 0; text-align: center; }
.eq { display: flex; gap: 6px; align-items: flex-end; height: 48px; }
.eq span { width: 10px; border-radius: 4px; background: linear-gradient(var(--a2), var(--a1)); animation: eq 0.9s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: -.2s; } .eq span:nth-child(3) { animation-delay: -.45s; } .eq span:nth-child(4) { animation-delay: -.65s; } .eq span:nth-child(5) { animation-delay: -.3s; }
@keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }

/* Stats drawer */
dialog.drawer {
  width: min(560px, 100%); max-width: 100%; margin: auto auto 0; border: 0; padding: 0; color: var(--text);
  background: var(--card); border-radius: 26px 26px 0 0; border-top: var(--border-w) solid var(--edge);

}

.drawer-inner {
  display: flex; flex-direction: column; gap: 16px;
  padding: 20px max(18px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
}
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.drawer-head h2 { font-size: 24px; }
.who { display: flex; flex-wrap: wrap; gap: 8px; }
.who .tile { padding: 8px 14px; font-size: 15px; }

.stat { padding: 14px 12px; border-radius: 16px; background: var(--card-hi); border: var(--border-w) solid var(--edge); display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.stat .lbl { font-size: 13px; font-weight: 600; color: var(--muted); letter-spacing: .03em; }
.seg .tile { padding: 9px 12px; font-size: 15px; }
.best {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 12px; padding: 14px 16px; border-radius: 16px;
  background: var(--gold-bg); border: var(--border-w) solid var(--gold-edge); box-shadow: 0 4px 0 var(--gold-deep);
}

  display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; animation: slide-in .35s ease-out;
  background: var(--card); border: var(--border-w) solid var(--brand); box-shadow: 0 5px 0 var(--brand-deep), 0 10px 30px color-mix(in srgb, var(--brand) 25%, transparent);
}
.resume-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.resume-text b { font-size: 17px; }
.resume-text span { color: var(--muted); font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.resume-actions { display: flex; align-items: center; gap: 4px; flex: none; }

@keyframes slide-in { from { transform: translateY(-12px); opacity: 0; } to { transform: none; opacity: 1; } }
.recap { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

.recap-round { margin: 6px 0 0; font-size: 14px; font-weight: 700; color: var(--muted); }
.recap-row {
  --pc: var(--brand);
  display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 12px 10px 10px;
  border-radius: 16px; background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);

<script>
"use strict";

// Bump this with every update that goes live, so it's easy to tell which version is loaded.
const APP_VERSION = "v27";

/* ============================================================
   SONG SOURCE — the only part of the app that knows where songs
   come from. Swap it (Spotify, a real server) without touching
   the game or UI.
   Contract:
     rows, categories                -> what players can pick
     peek(categoryId)                -> Promise<{ covers: string[], artists: string[] }> (card art)
     topArtists(), searchArtists(q)  -> Promise<Artist[]>   Artist: { id, name, picture }
     searchSongs(q)                  -> Promise<{ id, title, artist, cover }[]>
     getPool(choice, { need, onProgress, wellKnown }) -> Promise<Song[]>
       choice: { type: "category" | "artist", id } or { type: "library", service: "spotify" | "youtube", id: "liked" | playlistId }
     libraries.spotify / libraries.youtube: login and the player's own music, same shape:
       { available, connected(), prepare?(), connect(), disconnect(), profile(), playlists(), tracks(id) }
     Song: { id, title, artist, preview, cover }
   ============================================================ */
const SongSource = (() => {
  const API = "https://api.deezer.com";
  let callCount = 0;

  // Deezer's API has no CORS headers, so browsers reach it with JSONP.
  function jsonp(path, params) {
    return new Promise((resolve, reject) => {
      const name = "__dz" + Date.now() + "_" + (++callCount);
      const query = new URLSearchParams({ ...params, output: "jsonp", callback: name });
      const script = document.createElement("script");
      const timer = setTimeout(() => finish(new Error("Deezer took too long to answer. Try again.")), 12000);
      function finish(err, data) {
        clearTimeout(timer);
        window[name] = () => {}; // ignore a late reply
        script.remove();
        if (err) reject(err); else resolve(data);
      }
      window[name] = data => {
        if (data && data.error) finish(new Error(data.error.message || "Deezer returned an error."));
        else finish(null, data);
      };
      script.onerror = () => finish(new Error("Couldn't reach Deezer. Check your internet connection."));
      script.src = `${API}${path}?${query}`;
      document.head.appendChild(script);
    });
  }

  const rows = [
    { id: "now", label: "Right now" },
    { id: "decades", label: "Decades" },
    { id: "genres", label: "Genres" },
  ];
  // `chart` = Deezer's live chart for that genre id; `query` = playlist search.
  const categories = [
    { id: "top",         row: "now", label: "Today's Top Hits", era: "now", genre: null,      chart: 0 },
    { id: "now-pop",     row: "now", label: "Today's Pop",      era: "now", genre: "pop",     chart: 132 },
    { id: "now-hiphop",  row: "now", label: "Today's Hip-Hop",  era: "now", genre: "hiphop",  chart: 116 },
    { id: "now-rock",    row: "now", label: "Today's Rock",     era: "now", genre: "rock",    chart: 152 },
    { id: "now-rnb",     row: "now", label: "Today's R&B",      era: "now", genre: "rnb",     chart: 165 },
    { id: "now-country", row: "now", label: "Today's Country",  era: "now", genre: "country", chart: 84 },
    { id: "now-dance",   row: "now", label: "Today's Dance",    era: "now", genre: "dance",   chart: 113 },
    { id: "now-latin",   row: "now", label: "Today's Latin",    era: "now", genre: "latin",   chart: 197 },
    ...["2010s", "2000s", "90s", "80s", "70s", "60s"].map(d =>
      ({ id: d, row: "decades", label: `${d} Hits`, era: d, genre: null, query: `${d} hits` })),
    ...[["80s", "pop", "Pop"], ["90s", "rock", "Rock"], ["2000s", "hiphop", "Hip-Hop"], ["90s", "rnb", "R&B"],
        ["70s", "disco", "Disco"], ["80s", "rock", "Rock"], ["2010s", "pop", "Pop"], ["90s", "hiphop", "Hip-Hop"],
        ["2000s", "pop", "Pop"], ["2010s", "dance", "Dance"], ["2000s", "country", "Country"], ["60s", "rock", "Rock"]]
      .map(([d, g, name]) => ({ id: `${d}-${g}`, row: "genres", label: `${d} ${name}`, era: d, genre: g,
                                 query: `${d} ${name.toLowerCase().replace("-", " ")} hits` })),
  ];

  function normalize(t) {
    if (!t || !t.preview || !t.artist) return null;
    return {
      id: String(t.id),
      title: (t.title_short || t.title || "").trim(),
      artist: (t.artist.name || "").trim(),
      preview: t.preview,
      cover: t.album ? (t.album.cover_medium || t.album.cover || "") : "",
    };
  }

  // Versions that aren't the original recording. A clip is only used when the wanted song has the same marker.
  const MARKERS = /\b(slowed|sped up|speed up|nightcore|reverb|karaoke|instrumental|8d|cover|covers|tribute|made famous|in the style of|lofi|lo fi|remix|live|acoustic|unplugged|demo|orchestral)\b/g;
  // Of those, the ones that are never wanted in a game.
  const ODD = new Set(["slowed", "sped up", "speed up", "nightcore", "reverb", "karaoke", "instrumental", "8d", "tribute", "made famous", "in the style of", "lofi", "lo fi"]);
  const norm = s => String(s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
    .replace(/&/g, " and ").replace(/['’`]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const markersIn = s => new Set(norm(s).match(MARKERS) || []);
  const isOddVersion = (title, artist) => [...markersIn(title), ...markersIn(artist)].some(m => ODD.has(m));

  // Same song twice (remasters, live versions) counts once; slowed, karaoke and similar versions are left out.
  function dedupe(songs) {
    const seen = new Set();
    return songs.filter(s => {
      if (!s || !s.title || !s.artist) return false;
      if (isOddVersion(s.title, s.artist)) return false;
      const key = (s.title.replace(/\s[-–]\s.*$|\s*[([].*?[)\]]/g, "") + "|" + s.artist).toLowerCase().trim();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  const loaded = new Map(); // categoryId -> Promise<Song[]>
  function categorySongs(cat) {
    if (!loaded.has(cat.id)) {
      const job = (async () => {
        if (cat.chart !== undefined) {
          const chart = await jsonp(`/chart/${cat.chart}/tracks`, { limit: 100 });
          return dedupe((chart.data || []).map(normalize));
        }
        const found = await jsonp("/search/playlist", { q: cat.query, limit: 15 });
        const lists = (found.data || []).filter(p => (p.nb_tracks || 0) >= 30).slice(0, 2);
        let songs = [];
        for (const list of lists) {
          const tracks = await jsonp(`/playlist/${list.id}/tracks`, { limit: 100 });
          songs = songs.concat((tracks.data || []).map(normalize));
        }
        return dedupe(songs);
      })();
      job.catch(() => loaded.delete(cat.id)); // let a failed load be retried
      loaded.set(cat.id, job);
    }
    return loaded.get(cat.id);
  }

  const PEEK_KEY = "ntt-peek-v1";
  const PEEK_TTL = 12 * 60 * 60 * 1000;
  function peekCache() {
    try { return JSON.parse(localStorage.getItem(PEEK_KEY) || "{}") || {}; } catch (_) { return {}; }
  }
  async function peek(id) {
    const cached = peekCache()[id];
    if (cached && Date.now() - cached.t < PEEK_TTL) return cached;
    const cat = categories.find(c => c.id === id);
    const songs = await categorySongs(cat);
    const covers = [...new Set(songs.map(s => s.cover).filter(Boolean))].slice(0, 4);
    const artists = [...new Set(songs.map(s => s.artist))].slice(0, 3);
    const entry = { t: Date.now(), covers, artists };
    try {
      const all = peekCache();
      all[id] = entry;
      localStorage.setItem(PEEK_KEY, JSON.stringify(all));
    } catch (_) { /* storage unavailable */ }
    return entry;
  }

  const toArtist = a => ({ id: String(a.id), name: a.name, picture: a.picture_medium || a.picture || "" });
  async function topArtists() {
    const res = await jsonp("/chart/0/artists", { limit: 20 });
    return (res.data || []).map(toArtist);
  }
  async function searchArtists(q) {
    const res = await jsonp("/search/artist", { q, limit: 12 });
    return (res.data || []).map(toArtist);
  }
  // Song search for Heardle guesses: { id, title, artist, cover }
  async function searchSongs(q) {
    const res = await jsonp("/search", { q, limit: 15 });
    return dedupe((res.data || []).filter(t => t && t.artist).map(t => ({
      id: String(t.id), title: (t.title_short || t.title || "").trim(), artist: (t.artist.name || "").trim(),
      cover: t.album ? (t.album.cover_small || "") : "",
    })));
  }

  /* ---- Spotify: login (PKCE, no secret needed) and the player's own music ---- */
  const spotify = (() => {
    const CLIENT_ID = "7972270efb574ccba3e31915e981ee0d";
    const REDIRECT = "https://cathero1.github.io/song-quiz/";  // must match the app's Spotify dashboard
    const SCOPES = "user-library-read playlist-read-private playlist-read-collaborative";
    const KEY = "ntt-spotify";
    const available = location.origin === "https://cathero1.github.io";
    const read = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (_) { return null; } };
    const write = (k, v) => { try { v ? localStorage.setItem(k, JSON.stringify(v)) : localStorage.removeItem(k); } catch (_) {} };
    const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    let me = null;

    async function connect() {
      const verifier = b64url(crypto.getRandomValues(new Uint8Array(48)));
      const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
      const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      write(KEY + "-pkce", { verifier, state });
      location.href = "https://accounts.spotify.com/authorize?" + new URLSearchParams({
        response_type: "code", client_id: CLIENT_ID, scope: SCOPES, redirect_uri: REDIRECT,
        code_challenge_method: "S256", code_challenge: challenge, state,
      });
    }

    async function token(body) {
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ client_id: CLIENT_ID, ...body }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.access_token) throw new Error("Spotify login didn't go through. Try connecting again.");
      const prev = read(KEY);
      write(KEY, { access: data.access_token, refresh: data.refresh_token || (prev && prev.refresh), expires: Date.now() + (data.expires_in - 60) * 1000 });
    }

    // Runs once on page load. Returns null (no login in progress), "ok", or a message to show.
    async function finishLogin() {
      const params = new URLSearchParams(location.search);
      if (!params.has("code") && !params.has("error")) return null;
      history.replaceState(null, "", location.pathname);
      const saved = read(KEY + "-pkce");
      write(KEY + "-pkce", null);
      if (params.has("error")) return "Spotify login was cancelled.";
      if (!saved || saved.state !== params.get("state")) return "Spotify login didn't match up. Try connecting again.";
      try {
        await token({ grant_type: "authorization_code", code: params.get("code"), redirect_uri: REDIRECT, code_verifier: saved.verifier });
        return "ok";
      } catch (err) { return err.message; }
    }

    async function refresh() {
      const t = read(KEY);
      try { await token({ grant_type: "refresh_token", refresh_token: t && t.refresh }); }
      catch (_) { disconnect(); throw new Error("Your Spotify login expired. Connect again."); }
    }

    async function api(path, retried = false) {
      if (!read(KEY)) throw new Error("Connect Spotify first.");
      if (Date.now() > read(KEY).expires) await refresh();
      const res = await fetch("https://api.spotify.com/v1" + path, { headers: { Authorization: `Bearer ${read(KEY).access}` } });
      if (res.status === 401 && !retried) { await refresh(); return api(path, true); }
      if (res.status === 403) throw new Error("This Spotify account isn't on the app's list yet. Add it under User Management in the Spotify developer dashboard.");
      if (res.status === 429) throw new Error("Spotify is busy right now. Wait a minute and try again.");
      if (!res.ok) throw new Error("Spotify didn't answer. Try again.");
      return res.json();
    }

    function profile() {
      if (!me) {
        me = api("/me").then(u => ({ id: u.id, name: u.display_name || u.id }));
        me.catch(() => { me = null; });
      }
      return me;
    }

    // Spotify only shares the songs of playlists you made or collaborate on.
    async function playlists() {
      const user = await profile();
      const res = await api("/me/playlists?limit=50");
      return (res.items || [])
        .filter(p => p && (p.collaborative || (p.owner && p.owner.id === user.id)))
        .map(p => ({ id: p.id, name: p.name, picture: p.images && p.images[0] ? p.images[0].url : "", total: (p.items || p.tracks || {}).total || 0 }))
        .filter(p => p.total > 0);
    }

    async function tracks(id) {
      const out = [];
      for (let offset = 0; offset < 200; offset += 50) {
        const res = id === "liked"
          ? await api(`/me/tracks?limit=50&offset=${offset}`)
          : await api(`/playlists/${encodeURIComponent(id)}/items?limit=50&offset=${offset}`);
        for (const row of res.items || []) {
          const t = row.item || row.track;
          if (t && t.type === "track" && t.name && t.artists && t.artists[0]) out.push({ title: t.name, artist: t.artists[0].name });
        }
        if (!res.next) break;
      }
      return out;
    }

    function disconnect() { write(KEY, null); me = null; }

    return { available, connected: () => Boolean(read(KEY)), connect, finishLogin, disconnect, profile, playlists, tracks };
  })();

  /* ---- YouTube Music: Google login (short-lived token, no secret) and the player's playlists and likes ---- */
  const youtube = (() => {
    const CLIENT_ID = "531879754244-98c8l8hqj7c89qcnph8ukr1pd4gncsqs.apps.googleusercontent.com";
    const SCOPE = "https://www.googleapis.com/auth/youtube.readonly";
    const KEY = "ntt-youtube";
    const available = location.origin === "https://cathero1.github.io";  // the client's allowed origin
    const read = () => {
      try { const t = JSON.parse(localStorage.getItem(KEY) || "null"); return t && t.expires > Date.now() ? t : null; }
      catch (_) { return null; }
    };
    const write = v => { try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch (_) {} };
    let gis = null, me = null;

    // Google's login library; loaded when the section opens so the popup can open straight from the tap.
    function prepare() {
      if (!gis) {
        gis = new Promise((resolve, reject) => {
          const s = document.createElement("script");
          s.src = "https://accounts.google.com/gsi/client";
          s.onload = resolve;
          s.onerror = () => { gis = null; reject(new Error("Couldn't reach Google. Check your connection.")); };
          document.head.appendChild(s);
        });
      }
      return gis;
    }

    function connect() {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) return reject(new Error("Google login is still loading. Try again in a second."));
        google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPE,
          callback: res => {
            if (res.error || !res.access_token) return reject(new Error("Google login didn't go through. Make sure this account is added as a test user."));
            write({ access: res.access_token, expires: Date.now() + (Number(res.expires_in) - 60) * 1000 });
            resolve();
          },
          error_callback: err => reject(new Error(err && err.type === "popup_closed"
            ? "The Google login window was closed before finishing."
            : "Google login didn't open. If your browser blocks popups, allow them for this site.")),
        }).requestAccessToken();
      });
    }

    async function api(path) {
      const t = read();
      if (!t) throw new Error("Your YouTube Music login timed out. Connect again.");
      const res = await fetch("https://www.googleapis.com/youtube/v3" + path, { headers: { Authorization: `Bearer ${t.access}` } });
      if (res.status === 401) { write(null); me = null; throw new Error("Your YouTube Music login timed out. Connect again."); }
      if (res.status === 403) throw new Error("Google blocked this request. Make sure this account is a test user in the Google Cloud project.");
      if (!res.ok) throw new Error("YouTube didn't answer. Try again.");
      return res.json();
    }

    function profile() {
      if (!me) {
        me = api("/channels?part=snippet&mine=true").then(r => ({ name: r.items && r.items[0] ? r.items[0].snippet.title : "your Google account" }));
        me.catch(() => { me = null; });
      }
      return me;
    }

    async function playlists() {
      const res = await api("/playlists?part=snippet,contentDetails&mine=true&maxResults=50");
      return (res.items || []).map(p => {
        const th = p.snippet.thumbnails || {};
        return { id: p.id, name: p.snippet.title, picture: (th.high || th.medium || th.default || {}).url || "", total: p.contentDetails ? p.contentDetails.itemCount : 0 };
      }).filter(p => p.total > 0);
    }

    // Video titles are messy. Songs added in YouTube Music come from "Artist - Topic" channels with clean names;
    // otherwise "Artist - Song (Official Video)" is the usual pattern.
    function songFrom(title, channel) {
      const tidy = s => s.replace(/\s*[([][^)\]]*\b(official|lyrics?|audio|video|visuali[sz]er|hd|4k|remaster(ed)?)\b[^)\]]*[)\]]/gi, "").replace(/\s*\|.*$/, "").trim();
      channel = (channel || "").trim();
      if (/ - Topic$/.test(channel)) return { title: tidy(title), artist: channel.replace(/ - Topic$/, "") };
      const parts = title.split(/\s+[-–—]\s+/);
      if (parts.length >= 2) return { artist: parts[0].trim(), title: tidy(parts.slice(1).join(" - ")) };
      return { title: tidy(title), artist: channel.replace(/\s*(VEVO|Official)$/i, "").trim() };
    }

    async function tracks(id) {
      const out = [];
      let page = "";
      for (let i = 0; i < 4; i++) {
        const more = page ? `&pageToken=${encodeURIComponent(page)}` : "";
        const res = id === "liked"
          ? await api(`/videos?part=snippet&myRating=like&maxResults=50${more}`)
          : await api(`/playlistItems?part=snippet&maxResults=50&playlistId=${encodeURIComponent(id)}${more}`);
        for (const v of res.items || []) {
          const sn = v.snippet;
          if (!sn || !sn.title || /^(deleted|private) video$/i.test(sn.title)) continue;
          const song = songFrom(sn.title, sn.videoOwnerChannelTitle || sn.channelTitle);
          if (song.title && song.artist) out.push(song);
        }
        page = res.nextPageToken;
        if (!page) break;
      }
      return out;
    }

    function disconnect() {
      const t = read();
      write(null);
      me = null;
      if (t && window.google && google.accounts && google.accounts.oauth2) google.accounts.oauth2.revoke(t.access, () => {});
    }

    return { available, connected: () => Boolean(read()), prepare, connect, disconnect, profile, playlists, tracks };
  })();
  const libraries = { spotify, youtube };

  // Libraries give song names; the playable clips come from Deezer. Deezer search also returns slowed
  // edits, covers and tribute acts, so a result must be the same song by the same artist, with no version
  // marker the wanted song doesn't have. The same version beats others, exact artist and title beat partial ones,
  // then the most played wins.
  const plainTitle = s => s.replace(/\s[-–]\s.*$/, "").replace(/\s*[([].*?[)\]]/g, "").replace(/\b(feat|ft|featuring)\b.*$/i, "").trim();
  const baseTitle = s => norm(plainTitle(s)).replace(/^the /, "");
  const baseArtist = s => norm(s).replace(/^the /, "");
  function bestMatch(results, t) {
    const wantMarkers = markersIn(t.title + " " + t.artist);
    const title = baseTitle(t.title), artist = baseArtist(t.artist);
    let best = null, bestScore = -1;
    for (const d of results || []) {
      if (!d || !d.preview || !d.artist) continue;
      const dTitle = baseTitle(d.title || ""), dArtist = baseArtist(d.artist.name || "");
      const dMarkers = markersIn((d.title || "") + " " + d.artist.name);
      if (![...dMarkers].every(m => wantMarkers.has(m))) continue;
      const sameVersion = dMarkers.size === wantMarkers.size;   // e.g. your song is a remix and so is this one
      const exactArtist = dArtist === artist;
      if (!exactArtist && !(dArtist.includes(artist) || artist.includes(dArtist))) continue;
      const exactTitle = dTitle === title;
      if (!exactTitle && !(dTitle && (dTitle.includes(title) || title.includes(dTitle)))) continue;
      const score = (sameVersion ? 4e9 : 0) + (exactArtist ? 2e9 : 0) + (exactTitle ? 1e9 : 0) + Math.min(d.rank || 0, 9.9e8);
      if (score > bestScore) { bestScore = score; best = d; }
    }
    return best;
  }
  async function matchOnDeezer(t) {
    const title = plainTitle(t.title);
    const hit = bestMatch((await jsonp("/search", { q: `artist:"${t.artist}" track:"${title}"`, limit: 15 })).data, t)
      || bestMatch((await jsonp("/search", { q: `${t.artist} ${title}`, limit: 15 })).data, t);
    return hit ? { song: normalize(hit), rank: hit.rank || 0 } : null;
  }

  // Titles mostly in Japanese, Chinese or Korean characters are hard to name out loud.
  const hardToSay = title => {
    const letters = title.replace(/[\s\d\p{P}\p{S}]/gu, "");
    const cjk = (letters.match(/[\u3040-\u30ff\u3400-\u9fff\uac00-\ud7af]/g) || []).length;
    return letters.length > 0 && cjk / letters.length > 0.3;
  };

  // "Well-known only" looks up about 1.5x the songs needed (8 for 5, 15 for 10) and keeps the most played,
  // using Deezer's popularity rank, so deep cuts mostly drop out.
  async function libraryPool(service, id, need, onProgress, wellKnown) {
    let list = shuffle(await service.tracks(id));
    if (!list.length) throw new Error("No songs to play there. Pick another playlist.");
    if (wellKnown) list = [...list.filter(t => !hardToSay(t.title)), ...list.filter(t => hardToSay(t.title))];
    const target = wellKnown ? Math.max(need + 3, Math.ceil(need * 1.5)) : need;
    const found = new Map();
    let next = 0, inFlight = 0;
    // A lookup only starts while it could still be needed, so a 1-player game makes about 8, not 13.
    const worker = async () => {
      while (found.size + inFlight < target && next < list.length) {
        inFlight++;
        const hit = await matchOnDeezer(list[next++]).catch(() => null);
        inFlight--;
        if (hit && found.size < target && !found.has(hit.song.id)) {
          found.set(hit.song.id, hit);
          if (onProgress) onProgress(found.size, target);
        }
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    const hits = [...found.values()];
    if (wellKnown) hits.sort((a, b) => b.rank - a.rank);
    return dedupe(hits.map(h => h.song)).slice(0, need);
  }

  async function getPool(choice, { need = 0, onProgress, wellKnown = false } = {}) {
    if (choice.type === "library") return libraryPool(libraries[choice.service], choice.id, need, onProgress, wellKnown);
    if (choice.type === "artist") {
      const res = await jsonp(`/artist/${choice.id}/top`, { limit: 100 });
      return dedupe((res.data || []).map(normalize));
    }
    const cat = categories.find(c => c.id === choice.id) || categories[0];
    return categorySongs(cat);
  }

  return { rows, categories, peek, topArtists, searchArtists, searchSongs, getPool, libraries };
})();

/* ============================================================
   ANSWER MATCHER — forgiving check for typed (and later spoken)
   answers. Ignores case, accents, punctuation, "feat." credits,
   bracketed extras and a leading "The"; allows small typos and an
   extra or missing word as long as most of the name is right.
   ============================================================ */
const Matcher = (() => {
  const minor = new Set(["a", "an", "the", "and", "of", "to", "in", "on", "my", "me", "i", "you", "it", "is"]);

  function clean(s) {
    return String(s)
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .replace(/\s[-–—]\s.*$/, "")                 // "Song - Remastered 2011"
      .replace(/[([{].*?[)\]}]/g, " ")             // "(feat. X)", "[Live]"
      .replace(/\b(feat|ft|featuring)\b.*$/, " ")
      .replace(/&/g, " and ")
      .replace(/['’`]/g, "")                       // don't -> dont
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .replace(/^the /, "");
  }

  // Edit distance where swapping two neighbouring letters counts as one typo.
  function distance(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
    return d[a.length][b.length];
  }

  // How many typos a word of this length can have.
  const allowed = len => (len <= 3 ? 0 : len <= 5 ? 1 : Math.floor(len * 0.25));
  // Rough "sounds like" key: ph=f, c=k/s, z=s, doubled letters once, then the first letter,
  // the first vowel after it and the remaining consonants.
  // "sophia"/"sofia" -> "sof", "clara"/"clairo" -> "kalr", but "hello" -> "hel" vs "halo" -> "hal".
  function sound(word) {
    const w = word.replace(/ph/g, "f").replace(/ck|q/g, "k").replace(/c(?=[eiy])/g, "s").replace(/c/g, "k")
      .replace(/x/g, "ks").replace(/z/g, "s").replace(/^(kn|wr)/, m => m[1]).replace(/(.)\1+/g, "$1");
    const rest = w.slice(1);
    const vowel = (rest.match(/[aeiouy]/) || [""])[0];
    return (/[aeiouy]/.test(w[0]) ? "a" : w[0]) + vowel + rest.replace(/[aeiouyhw]/g, "");
  }
  const close = (a, b) => distance(a, b) <= allowed(Math.max(a.length, b.length)) ||
    (Math.min(a.length, b.length) >= 4 && sound(a).length >= 2 && sound(a) === sound(b));

  // Returns "exact", "close" or false.
  function check(guess, answer) {
    const g = clean(guess), a = clean(answer);
    if (!g || !a) return false;
    if (g === a) return "exact";
    if (close(g.replace(/ /g, ""), a.replace(/ /g, ""))) return "close";

    const aw = a.split(" "), gw = g.split(" ");
    const key = aw.filter(w => !minor.has(w));
    const needed = key.length ? key : aw;            // judge on the meaningful words
    const hit = needed.filter(w => gw.some(x => close(w, x))).length;
    const coverage = hit / needed.length;
    const usedGuess = gw.filter(x => aw.some(w => close(w, x))).length / gw.length;

    // Short names need every key word; longer ones need most of them.
    const enough = needed.length <= 2 ? coverage === 1 : coverage >= 0.6;
    return enough && usedGuess >= 0.5 ? "close" : false;
  }

  // One phrase for both parts, e.g. "blinding lights by the weeknd", "the weeknd blinding lights",
  // or just one of them. Tries every way of splitting the words and keeps the best reading.
  function checkBoth(texts, title, artist) {
    let best = { title: false, artist: false }, bestScore = -1;
    const consider = (t, a) => {
      const r = { title: check(t, title), artist: check(a, artist) };
      const score = (r.title ? 10 : 0) + (r.artist ? 10 : 0) + (r.title === "exact") + (r.artist === "exact");
      if (score > bestScore) { bestScore = score; best = r; }
    };
    for (const raw of texts) {
      const text = String(raw).replace(/^\s*(i think|i guess|maybe|is it|it'?s|its|this is|that'?s)\b\s*/i, "");
      const words = text.trim().split(/\s+/).filter(Boolean);
      consider(text, text);
      // If they said "by", split only there ("crazy in love by beyonce" is not "Crazy");
      // otherwise try every split ("the weeknd blinding lights").
      const byAt = words.map((w, i) => (/^by$/i.test(w) ? i : -1)).filter(i => i > 0 && i < words.length - 1);
      const splits = byAt.length ? byAt.map(i => [words.slice(0, i), words.slice(i + 1)])
        : words.slice(1).map((_, k) => [words.slice(0, k + 1), words.slice(k + 1)]);
      for (const [left, right] of splits) {
        consider(left.join(" "), right.join(" "));
        consider(right.join(" "), left.join(" "));
      }
    }
    return best;
  }

  // Heardle: the picked song is the answer if the cleaned titles match and the artists overlap.
  function sameArtist(a, b) {
    const x = clean(a), y = clean(b);
    return Boolean(x && y) && (x === y || x.includes(y) || y.includes(x));
  }
  function sameSong(a, b) {
    return clean(a.title) === clean(b.title) && sameArtist(a.artist, b.artist);
  }

  const sameTitle = (a, b) => Boolean(clean(a)) && clean(a) === clean(b);

  return { checkBoth, sameSong, sameArtist, sameTitle };
})();

/* ============================================================
   VOICE — speech-to-text through the browser (Chrome, Edge, Safari).
   ============================================================ */
const Voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const problems = {
    "not-allowed": "Microphone access is blocked. Allow it for this page, or type your answer.",
    "service-not-allowed": "Microphone access is blocked. Allow it for this page, or type your answer.",
    "audio-capture": "No microphone found. Type your answer instead.",
    "network": "Voice answers need an internet connection. Type your answer instead.",
    "no-speech": "Didn't catch that. Tap the mic and try again.",
  };
  let active = null;

  function stop() {
    if (!active) return;
    const r = active;
    active = null;
    r.onend = r.onresult = r.onerror = null;
    r.abort();
  }

  // onText(interim), onDone(alternatives[]), onError(message), onEnd()
  function listen({ onText, onDone, onError, onEnd }) {
    stop();
    const r = new SR();
    active = r;
    r.lang = "en-US";
    r.interimResults = true;
    r.maxAlternatives = 5;
    r.continuous = false;
    r.onresult = e => {
      const result = e.results[e.results.length - 1];
      if (result.isFinal) onDone(Array.from(result, alt => alt.transcript.trim()).filter(Boolean));
      else onText(result[0].transcript);
    };
    r.onerror = e => { if (e.error !== "aborted") onError(problems[e.error] || "Voice stopped working. Type your answer instead.", e.error); };
    r.onend = () => { active = null; onEnd(); };
    try { r.start(); } catch (_) { active = null; onError("Couldn't start the microphone. Type your answer instead."); onEnd(); }
  }

  return { supported: Boolean(SR), listen, stop };
})();

/* ============================================================
   STATS STORE — per-player stats kept in this browser.
   Swap for a server later without touching the UI.
   ============================================================ */
const StatsStore = (() => {
  const KEY = "ntt-stats";
  const STEPS = 6;   // Heardle steps (1, 2, 4, 7, 11, 16 seconds)
  const blankClassic = () => ({ games: 0, multiGames: 0, wins: 0, bestScore: 0, correct: 0, attempts: 0, streak: 0, bestStreak: 0, guessMs: 0, guesses: 0 });
  const blankHeardle = () => ({ games: 0, multiGames: 0, wins: 0, bestScore: 0, songs: 0, solved: 0, artistOnly: 0, streak: 0, bestStreak: 0,
                                dist: Array(STEPS).fill(0), missed: 0 });
  const id = name => name.trim().toLowerCase();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (_) { return {}; }
  }
  function save(all) {
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (_) { /* storage unavailable */ }
  }
  // One profile per name, with separate Classic and Heardle stats. Older saves kept Classic stats at the top level.
  function shape(raw, name) {
    raw = raw || {};
    const classic = Object.assign(blankClassic(), raw.classic || (raw.classic === undefined ? raw : {}));
    const heardle = Object.assign(blankHeardle(), raw.heardle);
    if (!Array.isArray(heardle.dist) || heardle.dist.length !== STEPS) heardle.dist = Array(STEPS).fill(0);
    return { name: name || raw.name || "", classic: pick(classic, blankClassic()), heardle: pick(heardle, blankHeardle()) };
  }
  const pick = (obj, template) => Object.fromEntries(Object.keys(template).map(k => [k, obj[k]]));
  function entry(all, name) {
    return (all[id(name)] = shape(all[id(name)], name));
  }
  const total = s => s.classic.games + s.heardle.games;

  return {
    // Classic: one result per part answered (title, artist).
    recordTurn(name, results, ms) {
      const all = load();
      const s = entry(all, name).classic;
      for (const right of results) {
        s.attempts++;
        if (right) { s.correct++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); }
        else s.streak = 0;
      }
      if (ms > 0) { s.guessMs += ms; s.guesses++; }
      save(all);
    },
    // Heardle: step is the index of the clip length they solved it at.
    recordHeardle(name, { won, step, artist }) {
      const all = load();
      const s = entry(all, name).heardle;
      s.songs++;
      if (won) { s.solved++; s.dist[step]++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); }
      else { s.missed++; s.streak = 0; if (artist) s.artistOnly++; }
      save(all);
    },
    recordGame(players, winners, mode) {
      const all = load();
      for (const p of players) {
        const s = entry(all, p.name)[mode === "heardle" ? "heardle" : "classic"];
        s.games++;
        s.bestScore = Math.max(s.bestScore || 0, p.score || 0);
        if (players.length > 1) {
          s.multiGames++;
          if (winners.includes(p.name)) s.wins++;
        }
      }
      save(all);
    },
    reset(name) {
      const all = load();
      if (all[id(name)]) { all[id(name)] = shape({ classic: {}, heardle: {} }, all[id(name)].name || name); save(all); }
    },
    remove(name) {
      const all = load();
      delete all[id(name)];
      save(all);
    },
    list() {
      const all = load();
      return Object.entries(all).map(([key, raw]) => shape(raw, raw && raw.name || key))
        .sort((a, b) => total(b) - total(a) || b.classic.attempts + b.heardle.songs - a.classic.attempts - a.heardle.songs);
    },
  };
})();

/* ============================================================
   GAME RULES — pure logic, no DOM.
   ============================================================ */
const Rules = {
  rounds: 5,
  pointsPerPart: 10,
  pointsFor(round) { return this.pointsPerPart * (round === this.rounds ? 2 : 1); },
};

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// One song per turn, no repeats until the pool runs out.
function buildQueue(pool, count) {
  let queue = [];
  while (queue.length < count) queue = queue.concat(shuffle(pool));
  return queue.slice(0, count);
}

/* ============================================================
   VISUALIZER — animated neon bars while a clip plays.
   ============================================================ */
const Viz = (() => {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let canvas = null, ctx = null, raf = 0, playing = false, levels = [], t = 0;

  function resize() {
    if (!canvas) return;
    const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * d));
    canvas.height = Math.max(1, Math.round(r.height * d));
    draw();
  }
  function draw() {
    if (!canvas || !canvas.isConnected) return;
    const d = window.devicePixelRatio || 1, w = canvas.width, h = canvas.height;
    const bw = 5 * d, gap = 4 * d, n = Math.max(1, Math.floor((w + gap) / (bw + gap)));
    const offset = (w - (n * (bw + gap) - gap)) / 2;
    const css = getComputedStyle(document.documentElement);
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, css.getPropertyValue("--a1").trim());
    grad.addColorStop(1, css.getPropertyValue("--a2").trim());
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = grad;
    ctx.shadowColor = css.getPropertyValue("--a1").trim();
    ctx.shadowBlur = playing ? 12 * d : 0;
    for (let i = 0; i < n; i++) {
      const wave = Math.abs(Math.sin(t * 0.07 + i * 0.45) * Math.sin(t * 0.029 + i * 0.13));
      const target = playing ? (reduced ? 0.25 + 0.5 * wave : 0.2 + 0.8 * wave * (0.65 + 0.35 * Math.random())) : 0.06;
      const prev = levels[i] ?? 0.06;
      levels[i] = reduced ? target : prev + (target - prev) * 0.3;
      const bh = Math.max(3 * d, levels[i] * h * 0.9);
      ctx.fillRect(offset + i * (bw + gap), (h - bh) / 2, bw, bh);
    }
  }
  function loop() {
    t++;
    draw();
    const settling = levels.some(v => v > 0.07);
    raf = (playing && !reduced) || (!playing && settling && !reduced) ? requestAnimationFrame(loop) : 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  window.addEventListener("resize", resize);
  return {
    attach(c) { canvas = c; ctx = c.getContext("2d"); levels = []; resize(); },
    start() { playing = true; kick(); },
    stop() { playing = false; kick(); },
  };
})();

/* ============================================================
   SOUND EFFECTS — short chimes made in the browser (no files).
   ============================================================ */
const Sfx = (() => {
  let ctx = null;

  function unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
  }

  function tone(freq, at, dur, { type = "triangle", gain = 0.16, slideTo = 0 } = {}) {
    if (!ctx || ctx.state !== "running") return;
    const t0 = ctx.currentTime + at;
    const osc = ctx.createOscillator(), amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(amp).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }
  const seq = (notes, step, opts) => notes.forEach((f, i) => tone(f, i * step, step * 2.2, opts));

  return {
    unlock,
    turn() { seq([659, 880], 0.12); },
    listen() { tone(587, 0, 0.12, { type: "sine", gain: 0.2 }); tone(880, 0.09, 0.18, { type: "sine", gain: 0.2 }); },
    tick() { tone(1320, 0, 0.06, { type: "square", gain: 0.04 }); },
    right() { seq([523, 659, 784, 1047], 0.09, { gain: 0.2 }); },
    partial() { seq([523, 659], 0.12); },
    wrong() { tone(233, 0, 0.32, { type: "sawtooth", gain: 0.09, slideTo: 150 }); tone(175, 0.2, 0.42, { type: "sawtooth", gain: 0.08, slideTo: 110 }); },
    bonus() { seq([523, 659, 784, 659, 784, 1047], 0.09, { gain: 0.18 }); tone(1568, 0.55, 0.4, { type: "sine", gain: 0.12 }); },
    count() { tone(1760, 0, 0.035, { type: "square", gain: 0.03 }); },
    countdown(n) { tone(n === 1 ? 988 : 659, 0, 0.18, { type: "sine", gain: 0.22 }); },
    win() { seq([523, 523, 523, 659, 784, 659, 784, 1047], 0.13, { gain: 0.18 }); },
  };
})();

// Browsers only allow sound after a tap. Call this inside a tap so later clips can start by themselves.
const SILENCE = (() => {
  const bytes = new Uint8Array(46);
  const view = new DataView(bytes.buffer);
  const text = (o, s) => [...s].forEach((c, i) => bytes[o + i] = c.charCodeAt(0));
  text(0, "RIFF"); view.setUint32(4, 38, true); text(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, 8000, true); view.setUint32(28, 16000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, "data"); view.setUint32(40, 2, true);
  return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
})();

// Reads the answer out loud after a miss, using the device's built-in voice.
const Announcer = (() => {
  const synth = window.speechSynthesis;
  let voice = null;
  const pickVoice = () => {
    const voices = synth ? synth.getVoices() : [];
    voice = voices.find(v => /^en(-|_)US/i.test(v.lang) && /natural|samantha|google/i.test(v.name))
      || voices.find(v => /^en(-|_)US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
  };
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  function speak(text, volume) {
    if (!synth) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 1.02;
    u.volume = volume;
    if (voice) u.voice = voice;
    synth.speak(u);
  }
  return {
    // Some phones only allow speech after a tap, so a silent word is spoken inside one.
    unlock() { if (synth && !synth.speaking) speak(" ", 0); },
    say(text) { if (synth) { synth.cancel(); speak(text, 1); } },
    stop() { if (synth) synth.cancel(); },
  };
})();

// Starts downloading a clip ahead of time (during a countdown) so it plays the moment it's needed.
function preloadClip(song) {
  if (!song || audio.src === song.preview) return;
  audio.src = song.preview;
  audio.preload = "auto";
  audio.load();
}

function primeAudio() {
  Sfx.unlock();
  Announcer.unlock();
  if (audio.paused) {
    audio.src = SILENCE;
    audio.play().catch(() => {});
  }
}

// Timers that belong to the current screen; cleared whenever the screen changes.
const turnTimers = new Set();
function later(fn, ms) { const id = setTimeout(() => { turnTimers.delete(id); fn(); }, ms); turnTimers.add(id); return id; }
function every(fn, ms) { const id = setInterval(fn, ms); turnTimers.add(id); return id; }
function clearTurnTimers() { turnTimers.forEach(id => clearTimeout(id)); turnTimers.clear(); autoToken++; }

// Keeps the screen on during a game, since nobody touches the phone between turns.
const ScreenAwake = (() => {
  let lock = null, wanted = false;
  const grab = async () => { try { lock = navigator.wakeLock ? await navigator.wakeLock.request("screen") : null; } catch (_) { lock = null; } };
  document.addEventListener("visibilitychange", () => { if (wanted && document.visibilityState === "visible") grab(); });
  return {
    on() { wanted = true; grab(); },
    off() { wanted = false; if (lock) lock.release().catch(() => {}); lock = null; },
  };
})();

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ---------- Saved game ---------- */
// Saved at the start of every turn, so a reload (phones often reload tabs left in the background)
// can pick up at the same turn with the same song and scores.
const SAVE_KEY = "ntt-save";
const SAVE_TTL = 24 * 60 * 60 * 1000;

function saveGame(pos = { round: game.round, turn: game.turn }) {
  const { players, artistMode, mode, history, queue, label } = game;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ t: Date.now(), game: { players, artistMode, mode, history, queue, label, ...pos } })); }
  catch (_) { /* storage unavailable: no resume */ }
}
function loadSave() {
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if (saved && saved.game && Array.isArray(saved.game.queue) && Date.now() - saved.t < SAVE_TTL) return saved.game;
  } catch (_) { /* unreadable save */ }
  clearSave();
  return null;
}
function clearSave() {
  try { localStorage.removeItem(SAVE_KEY); } catch (_) {}
}
function resumeGame(saved) {
  primeAudio();
  game = { ...saved, pool: saved.queue, recorded: false };
  applyAccent();
  ScreenAwake.on();
  window.scrollTo({ top: 0 });
  if (game.round > Rules.rounds) return renderFinal();
  renderTurn();
}
function resumeCard(saved) {
  const round = Math.min(saved.round, Rules.rounds);
  const scores = saved.players.map(p => `${esc(p.name)} ${p.score}`).join(" · ");
  return `

        <b>Continue your game?</b>
        <span>${saved.mode === "heardle" ? "Heardle" : "Classic"}${saved.label ? ` · ${esc(saved.label)}` : ""} · Round ${round} of ${Rules.rounds}</span>

}

      <p class="hint">${lib.hint}</p>
      <button class="ghost-btn" data-connect>${icon("library")} ${lib.connect}</button>` : `
      <p class="hint">This connects on the website version of Song Quiz, at cathero1.github.io/song-quiz.</p>`}`;
