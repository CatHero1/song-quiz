<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Song Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one stage column on a bright floor. Each look sets the surfaces and a fixed --brand;
   the selected era/genre sets --a1/--a2 for highlights (tiles, ring, visualizer, answers). */
:root {
  /* Sky (default): light blue on white */
  --floor: #f3faff;
  --glow-1: #bfe7ff;
  --glow-2: #d9f1ff;
  --card: #ffffff;
  --card-hi: #eef7fd;
  --edge: #cbe3f3;
  --edge-deep: #9ccbe9;
  --border-w: 2px;
  --text: #0b2540;
  --muted: #557590;
  --on-accent: #0b2540;
  --brand: #1fb2ff;
  --brand-deep: #0b7fc0;
  --right: #12b76a;
  --wrong: #f04438;
  --scrim: rgba(11, 37, 64, .35);
  --on-brand: #ffffff;
  --cta-text-shadow: 0 2px 0 var(--brand-deep);
  --gold-bg: #fff6cc;
  --gold-edge: #e0a800;
  --gold-deep: #c08f00;
  --gold-text: #a87800;
  --a1: #ff2e88;   /* set from the selected era/genre */
  --a2: #00b4ff;
  --font-marquee: "Bungee", "Arial Black", Impact, sans-serif;
  --font-ui: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-look="lemon"] {
  --floor: #ffe14d;
  --glow-1: #fff3a8;
  --glow-2: #ffd21f;
  --card: #ffffff;
  --card-hi: #fff8d6;
  --edge: #161616;
  --edge-deep: #161616;
  --border-w: 3px;
  --text: #161616;
  --muted: #5a4d12;
  --on-accent: #161616;
  --brand: #ff2e88;
  --brand-deep: #161616;
  --scrim: rgba(22, 22, 22, .45);
}
:root[data-look="bubblegum"] {
  --floor: #fff0f7;
  --glow-1: #ffc9e2;
  --glow-2: #c8ecff;
  --card: #ffffff;
  --card-hi: #fff4f9;
  --edge: #f6cfe1;
  --edge-deep: #eaa3c4;
  --text: #3a0f2a;
  --muted: #8a5272;
  --on-accent: #3a0f2a;
  --brand: #ff3d95;
  --brand-deep: #c4166a;
  --scrim: rgba(58, 15, 42, .35);
}

/* Dark themes */
:root[data-look="neon"], :root[data-look="vinyl"], :root[data-look="lagoon"] {
  --gold-bg: #2e2508; --gold-edge: #ffbf00; --gold-deep: #6b5000; --gold-text: #ffcf40;
  --border-w: 2px;
  color-scheme: dark;
}
:root[data-look="neon"] {
  --floor: #06060a;
  --glow-1: rgba(255, 46, 136, .24);
  --glow-2: rgba(0, 214, 255, .18);
  --card: #111118;
  --card-hi: #1a1a24;
  --edge: #2b2b36;
  --edge-deep: #000000;
  --text: #f7f7ff;
  --muted: #9d9db4;
  --brand: #ff2e88;
  --brand-deep: #8c0045;
  --on-brand: #ffffff;
  --scrim: rgba(0, 0, 0, .65);
}
:root[data-look="neon"] .marquee-text { text-shadow: 3px 3px 0 var(--brand), 0 0 22px color-mix(in srgb, var(--brand) 70%, transparent); }
:root[data-look="neon"] .cta { box-shadow: 0 7px 0 var(--brand-deep), 0 0 34px color-mix(in srgb, var(--brand) 60%, transparent); }
:root[data-look="neon"] .tile[aria-pressed="true"] { box-shadow: 0 5px 0 #000, 0 0 26px color-mix(in srgb, var(--a1) 60%, transparent); }
:root[data-look="neon"] .disc { box-shadow: 0 6px 0 #000, 0 0 50px color-mix(in srgb, var(--a1) 45%, transparent); }
:root[data-look="vinyl"] {
  --floor: #16110d;
  --glow-1: rgba(255, 166, 0, .16);
  --glow-2: rgba(255, 90, 60, .12);
  --card: #221a14;
  --card-hi: #2c221a;
  --edge: #3f3127;
  --edge-deep: #0b0705;
  --text: #fbefdf;
  --muted: #b59f88;
  --brand: #ffad1f;
  --brand-deep: #9a5c00;
  --on-brand: #1d1206;
  --cta-text-shadow: none;
  --scrim: rgba(8, 5, 3, .6);
}
:root[data-look="lagoon"] {
  --floor: #03222a;
  --glow-1: rgba(25, 227, 199, .18);
  --glow-2: rgba(255, 107, 107, .14);
  --card: #07323c;
  --card-hi: #0b3e4a;
  --edge: #155462;
  --edge-deep: #011418;
  --text: #ecfffb;
  --muted: #8dc4bc;
  --brand: #19e3c7;
  --brand-deep: #08806f;
  --on-brand: #03222a;
  --cta-text-shadow: none;
  --scrim: rgba(1, 15, 19, .6);
}

/* Theme menu */
.theme-menu { position: relative; }
.theme-menu .small-btn { padding-inline: 11px; }
.theme-panel {
  display: none; position: absolute; right: 0; top: 100%; z-index: 20; padding-top: 10px; width: min(300px, calc(100vw - 32px));
}
.theme-menu.open .theme-panel { display: block; }
@media (hover: hover) { .theme-menu:hover .theme-panel, .theme-menu:focus-within .theme-panel { display: block; } }
.theme-card {
  display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 6px 0 var(--edge-deep), 0 16px 40px rgba(0,0,0,.18);
}
.theme-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.theme-opt {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 4px; border-radius: 12px;
  background: transparent; border: var(--border-w) solid transparent; font-weight: 600; font-size: 14px;
}
.theme-opt:hover { background: var(--card-hi); }
.theme-opt[aria-pressed="true"] { border-color: var(--brand); background: var(--card-hi); }
.theme-dot { width: 40px; height: 40px; border-radius: 50%; position: relative; overflow: hidden; border: 2px solid var(--edge); }
.theme-dot i { position: absolute; }
.theme-dot i:nth-child(1) { inset: 0; }
.theme-dot i:nth-child(2) { inset: 50% 0 0 0; }
.theme-dot i:nth-child(3) { width: 16px; height: 16px; border-radius: 50%; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px rgba(255,255,255,.7); }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body {
  background:
    radial-gradient(60% 45% at 8% -8%, var(--glow-1), transparent 70%),
    radial-gradient(55% 40% at 105% 20%, var(--glow-2), transparent 70%),
    radial-gradient(60% 40% at 50% 115%, color-mix(in srgb, var(--a1) 14%, transparent), transparent 70%),
    var(--floor);
  background-attachment: fixed;
  color: var(--text);
  font: 500 16px/1.45 var(--font-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
}
.stage { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
button:disabled { cursor: not-allowed; }
svg.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Marquee type: solid ink with a hard offset shadow, like a sticker */
.marquee-text {
  font-family: var(--font-marquee); font-weight: 400; letter-spacing: -.01em; line-height: 1.02; margin: 0;
  color: var(--text); text-shadow: 3px 3px 0 var(--brand);
  text-wrap: balance;
}
.section-title { font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }

/* Top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.logo { font-size: 20px; }
.logo.home { font-size: clamp(38px, 11vw, 60px); padding-top: 6px; text-shadow: 4px 4px 0 var(--brand); }
.small-btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 14px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
  font-weight: 700; font-size: 15px; transition: transform .08s, box-shadow .08s;
}
.small-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-deep); }

/* 3D tiles (era/genre/mode/clip/look choices) */
.tile {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; min-width: 0;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 5px 0 var(--edge-deep);
  font-weight: 600; font-size: 16px; text-align: left; transition: transform .08s, box-shadow .08s, border-color .15s, background .15s;
}
.tile .ico { color: var(--muted); transition: color .15s; }
.tile:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--edge-deep); }
.tile[aria-pressed="true"] {
  border-color: color-mix(in srgb, var(--a1) 80%, var(--edge));
  background: color-mix(in srgb, var(--a1) 18%, var(--card));
  box-shadow: 0 5px 0 color-mix(in srgb, var(--a1) 70%, #000), 0 8px 22px color-mix(in srgb, var(--a1) 30%, transparent);
}
:root[data-look="lemon"] .tile[aria-pressed="true"] { background: var(--a1); border-color: var(--edge); box-shadow: 0 5px 0 var(--edge-deep); }
.tile[aria-pressed="true"] .ico { color: color-mix(in srgb, var(--a1) 75%, var(--text)); }
:root[data-look="lemon"] .tile[aria-pressed="true"] .ico { color: var(--text); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px 10px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles.three .tile { justify-content: center; }

.block { display: flex; flex-direction: column; gap: 12px; }

/* Player tiles */
.ptiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.ptile {
  --pc: var(--brand);
  display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 12px; border-radius: 18px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 16%, var(--card)), var(--card) 70%);
  border: var(--border-w) solid color-mix(in srgb, var(--pc) 60%, var(--edge));
  box-shadow: 0 5px 0 color-mix(in srgb, var(--pc) 55%, var(--edge-deep));
}
:root[data-look="lemon"] .ptile { border-color: var(--edge); box-shadow: 0 5px 0 var(--edge-deep); }
.ptile:focus-within { box-shadow: 0 5px 0 color-mix(in srgb, var(--pc) 55%, var(--edge-deep)), 0 0 0 4px color-mix(in srgb, var(--pc) 30%, transparent); }
.avatar {
  width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center;
  background: var(--pc); color: #fff; font-weight: 700; font-size: 19px; text-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.ptile input { flex: 1; min-width: 0; background: transparent; border: 0; font-size: 18px; font-weight: 600; padding: 6px 2px; }
.ptile input:focus-visible { outline: none; }
.x-btn { width: 36px; height: 36px; flex: none; border-radius: 10px; border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; }
.x-btn:hover { color: var(--text); background: var(--card-hi); }
.x-btn:disabled { opacity: .3; }
.add-tile {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 66px; border-radius: 18px;
  border: var(--border-w) dashed var(--edge-deep); background: color-mix(in srgb, var(--card) 55%, transparent); color: var(--muted); font-weight: 600; font-size: 16px;
}
.add-tile:hover { border-color: var(--brand); color: var(--text); }

/* Big CTA */
.cta {
  padding: 18px; border-radius: 20px; border: var(--border-w) solid var(--brand-deep); color: var(--on-brand);
  background: var(--brand);
  font-family: var(--font-marquee); font-size: 20px; letter-spacing: .02em; text-shadow: var(--cta-text-shadow);
  box-shadow: 0 7px 0 var(--brand-deep), 0 12px 28px color-mix(in srgb, var(--brand) 35%, transparent);
  transition: transform .08s, box-shadow .08s;
}
:root[data-look="lemon"] .cta { text-shadow: 2px 2px 0 var(--edge); box-shadow: 0 7px 0 var(--edge-deep); }
.cta:active:not(:disabled) { transform: translateY(5px); box-shadow: 0 2px 0 var(--brand-deep); }
.cta:disabled { filter: grayscale(.7); opacity: .55; }
.ghost-btn {
  padding: 16px 18px; border-radius: 20px; background: var(--card); border: var(--border-w) solid var(--edge);
  box-shadow: 0 6px 0 var(--edge-deep); font-weight: 700; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .08s, box-shadow .08s;
}
.ghost-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--edge-deep); }
.actions { display: flex; gap: 12px; }
.actions > * { flex: 1; }
.error { color: var(--wrong); font-weight: 600; margin: 0; }
.hint { color: var(--muted); margin: 0; font-size: 15px; }
.center { text-align: center; }


/* Leaderboard */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 8px; }
.lb {
  --pc: var(--brand);
  position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 14px; min-width: 0;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep); font-weight: 600;
}
.lb .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
.lb .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb.now { border-color: var(--pc); box-shadow: 0 4px 0 color-mix(in srgb, var(--pc) 70%, #000); }
.lb.lead-player .dot { box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold-edge) 60%, transparent); }
.lb.scored { animation: scored 1.3s ease-out; }
@keyframes scored { 0% { transform: scale(1); } 15% { transform: scale(1.06); } 100% { transform: scale(1); } }
.odo { display: inline-flex; font-family: var(--font-marquee); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; }
.dig { display: inline-block; height: 1em; width: .7em; overflow: hidden; transition: width .4s, opacity .4s; }
.dig.lead { width: 0; opacity: 0; }
.strip { display: flex; flex-direction: column; transform: translateY(calc(var(--d) * -1em)); transition: transform 1.1s cubic-bezier(.2, .9, .25, 1); }
.strip i { display: block; height: 1em; font-style: normal; text-align: center; }
.pop {
  position: absolute; right: 10px; top: -10px; font-family: var(--font-marquee); font-size: 18px; color: var(--right);
  text-shadow: 2px 2px 0 color-mix(in srgb, var(--right) 30%, #000); pointer-events: none; animation: pop 1.5s ease-out forwards;
}
@keyframes pop { 0% { opacity: 0; transform: translateY(8px) scale(.6); } 20% { opacity: 1; transform: translateY(-6px) scale(1.15); } 100% { opacity: 0; transform: translateY(-34px) scale(1); } }

/* Turn header */
.turn-head { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.round-pill { font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums; }
.turn-name { font-family: var(--font-marquee); font-size: clamp(30px, 9vw, 46px); line-height: 1.05; color: var(--text); text-shadow: 3px 3px 0 var(--pc); overflow-wrap: anywhere; }
.double {
  padding: 5px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  background: #ffbf00; color: #2a1d00; border: var(--border-w) solid color-mix(in srgb, #ffbf00 60%, #000);
}

/* Clip player */
.deck { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.clip-btn { position: relative; width: min(200px, 56vw); aspect-ratio: 1; border: 0; padding: 0; background: none; border-radius: 50%; max-width: 100%; }
.clip-btn svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
.ring .track { fill: none; stroke: var(--edge); stroke-width: 6; }
.ring .bar { fill: none; stroke: url(#ringGrad); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset .1s linear; }
.disc {
  position: absolute; inset: 10%; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle at 50% 30%, var(--card), var(--card-hi) 80%);
  border: var(--border-w) solid var(--edge);
  box-shadow: 0 6px 0 var(--edge-deep), 0 14px 34px color-mix(in srgb, var(--a1) 22%, transparent);
}
.disc .count { font-family: var(--font-marquee); font-size: clamp(40px, 13vw, 58px); line-height: 1; color: var(--text); text-shadow: 3px 3px 0 var(--a1); font-variant-numeric: tabular-nums; }
.disc img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
.disc .play { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; letter-spacing: .08em; font-size: 14px; color: var(--muted); }
.disc .play svg { width: 46px; height: 46px; fill: var(--a1); stroke: none; }
.playing .disc { border-color: var(--a1); box-shadow: 0 6px 0 color-mix(in srgb, var(--a1) 70%, #000), 0 0 44px color-mix(in srgb, var(--a1) 40%, transparent); }
.viz { width: 100%; height: 64px; display: block; }


/* Play again / Skip */
.pills { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 999px;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
  font-weight: 600; font-size: 16px; transition: transform .08s, box-shadow .08s, opacity .2s;
}
.pill .ico { width: 18px; height: 18px; }
.pill:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-deep); }
.pill:disabled { opacity: .45; }
.count-badge { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; display: inline-grid; place-items: center; background: var(--a1); color: #fff; font-size: 13px; font-weight: 700; }

/* Answer: mic first, typing second */
.answer { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
.mic {
  width: 78px; height: 78px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--brand); color: var(--on-brand); border: var(--border-w) solid var(--brand-deep); box-shadow: 0 6px 0 var(--brand-deep);
  transition: transform .08s, box-shadow .08s;
}
.mic .ico { width: 32px; height: 32px; }
.mic:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--brand-deep); }
.mic:disabled { opacity: .45; }
.mic.listening { animation: pulse 1.2s ease-out infinite; }
@keyframes pulse {
  0% { box-shadow: 0 6px 0 var(--brand-deep), 0 0 0 0 color-mix(in srgb, var(--brand) 55%, transparent); }
  100% { box-shadow: 0 6px 0 var(--brand-deep), 0 0 0 22px transparent; }
}
.mic-status { margin: 0; font-weight: 600; font-size: 17px; min-height: 1.45em; max-width: 40ch; overflow-wrap: anywhere; }
.mic-status b { color: var(--text); }
.type-row { display: flex; gap: 8px; width: 100%; }
.typed {
  flex: 1; min-width: 0; padding: 12px 14px; border-radius: 14px; background: var(--card); border: var(--border-w) solid var(--edge);
  box-shadow: 0 4px 0 var(--edge-deep); font-size: 16px; font-weight: 600;
}
.typed::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
.typed:focus-visible { outline: none; border-color: var(--a1); box-shadow: 0 4px 0 var(--edge-deep), 0 0 0 4px color-mix(in srgb, var(--a1) 25%, transparent); }
.send {
  width: 52px; flex: none; border-radius: 14px; display: grid; place-items: center;
  background: var(--card); border: var(--border-w) solid var(--edge); box-shadow: 0 4px 0 var(--edge-deep);
}
.send:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-deep); }
.verdicts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.verdicts li { display: flex; gap: 8px; align-items: center; font-size: 16px; overflow-wrap: anywhere; }
.verdicts li.ok .ico { color: var(--right); }
.verdicts li.no .ico { color: var(--wrong); }

/* Result card */
.result {
  display: flex; flex-direction: column; gap: 16px; padding: 18px; border-radius: 22px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--a1) 14%, var(--card)), var(--card) 70%);
  border: var(--border-w) solid color-mix(in srgb, var(--a1) 55%, var(--edge));
  box-shadow: 0 6px 0 color-mix(in srgb, var(--a1) 45%, var(--edge-deep));
}
:root[data-look="lemon"] .result { border-color: var(--edge); box-shadow: 0 6px 0 var(--edge-deep); }
.song { display: flex; gap: 14px; align-items: center; }
.song img { width: 80px; height: 80px; border-radius: 12px; flex: none; background: var(--card-hi); border: var(--border-w) solid var(--edge); }
.song .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.song .t { font-weight: 700; font-size: 20px; overflow-wrap: anywhere; line-height: 1.2; }

.standings .nm::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--pc); flex: none; }
.standings .pts { font-family: var(--font-marquee); font-size: 22px; font-variant-numeric: tabular-nums; }

/* Loading */

.eq span { width: 10px; border-radius: 4px; background: linear-gradient(var(--a2), var(--a1)); animation: eq 0.9s ease-in-out infinite; }
.eq span:nth-child(2) { animation-delay: -.2s; } .eq span:nth-child(3) { animation-delay: -.45s; } .eq span:nth-child(4) { animation-delay: -.65s; } .eq span:nth-child(5) { animation-delay: -.3s; }
@keyframes eq { 0%, 100% { height: 20%; } 50% { height: 100%; } }

  background: var(--card); border-radius: 26px 26px 0 0; border-top: var(--border-w) solid var(--edge);

}
.drawer-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

@media (max-width: 440px) { .stat-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { padding: 14px 12px; border-radius: 16px; background: var(--card-hi); border: var(--border-w) solid var(--edge); display: flex; flex-direction: column; gap: 4px; min-width: 0; }

<body>
<main class="stage" id="app"></main>
<audio id="audio" preload="auto"></audio>
<dialog class="drawer" id="stats" aria-labelledby="stats-title"></dialog>

<script>
"use strict";

/* ============================================================
   SONG SOURCE — the only part of the app that knows where songs
   come from. Swap it (Spotify liked songs, a real server) without
   touching the game or UI.
   Contract:  getPool({ era, genre }) -> Promise<Song[]>
   Song:      { id, title, artist, preview, cover }
   ============================================================ */
const SongSource = (() => {
  const API = "https://api.deezer.com";
  let callCount = 0;

  // Deezer's API has no CORS headers, so browsers reach it with JSONP.
  function jsonp(path, params) {
    return new Promise((resolve, reject) => {
      const name = "__dz" + Date.now() + "_" + (++callCount);
      const query = new URLSearchParams({ ...params, output: "jsonp", callback: name });
      const script = document.createElement("script");
      const timer = setTimeout(() => finish(new Error("Deezer took too long to answer. Try again.")), 12000);
      function finish(err, data) {
        clearTimeout(timer);
        window[name] = () => {}; // ignore a late reply
        script.remove();
        if (err) reject(err); else resolve(data);
      }
      window[name] = data => {
        if (data && data.error) finish(new Error(data.error.message || "Deezer returned an error."));
        else finish(null, data);
      };
      script.onerror = () => finish(new Error("Couldn't reach Deezer. Check your internet connection."));
      script.src = `${API}${path}?${query}`;
      document.head.appendChild(script);
    });
  }

  const eras = [
    { id: "top",   label: "Today's Top Hits", search: null },
    { id: "2010s", label: "2010s", search: "2010s" },
    { id: "2000s", label: "2000s", search: "2000s" },
    { id: "90s",   label: "90s",   search: "90s" },
    { id: "80s",   label: "80s",   search: "80s" },
    { id: "70s",   label: "70s",   search: "70s" },
    { id: "60s",   label: "60s",   search: "60s" },
  ];
  // Deezer genre ids (used for the live charts).
  const genres = [
    { id: "all",     label: "Any genre", deezer: 0,   search: "" },
    { id: "pop",     label: "Pop",       deezer: 132, search: "pop" },
    { id: "rock",    label: "Rock",      deezer: 152, search: "rock" },
    { id: "hiphop",  label: "Hip-Hop",   deezer: 116, search: "hip hop" },
    { id: "rnb",     label: "R&B",       deezer: 165, search: "r&b" },
    { id: "country", label: "Country",   deezer: 84,  search: "country" },
    { id: "dance",   label: "Dance",     deezer: 113, search: "dance" },
    { id: "latin",   label: "Latin",     deezer: 197, search: "latin" },
  ];

  function normalize(t) {
    if (!t || !t.preview || !t.artist) return null;
    return {
      id: String(t.id),
      title: (t.title_short || t.title || "").trim(),
      artist: (t.artist.name || "").trim(),
      preview: t.preview,
      cover: t.album ? (t.album.cover_medium || t.album.cover || "") : "",
    };
  }

  function dedupe(songs) {
    const seen = new Set();
    return songs.filter(s => {
      if (!s || !s.title || !s.artist) return false;
      const key = (s.title + "|" + s.artist).toLowerCase();
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
  }

  async function fromPlaylists(query) {
    const found = await jsonp("/search/playlist", { q: query, limit: 15 });
    const lists = (found.data || []).filter(p => (p.nb_tracks || 0) >= 30).slice(0, 2);
    let songs = [];
    for (const list of lists) {
      const tracks = await jsonp(`/playlist/${list.id}/tracks`, { limit: 100 });
      songs = songs.concat((tracks.data || []).map(normalize));
    }
    return songs;
  }

  async function getPool({ era, genre }) {
    const e = eras.find(x => x.id === era) || eras[0];
    const g = genres.find(x => x.id === genre) || genres[0];
    let songs;
    if (!e.search) {
      const chart = await jsonp(`/chart/${g.deezer}/tracks`, { limit: 100 });
      songs = (chart.data || []).map(normalize);
    } else {
      songs = await fromPlaylists(`${e.search} ${g.search} hits`.replace(/\s+/g, " ").trim());
    }
    return dedupe(songs);
  }

  return { eras, genres, getPool };
})();

/* ============================================================
   ANSWER MATCHER — forgiving check for typed (and later spoken)
   answers. Ignores case, accents, punctuation, "feat." credits,
   bracketed extras and a leading "The"; allows small typos and an
   extra or missing word as long as most of the name is right.
   ============================================================ */
const Matcher = (() => {
  const minor = new Set(["a", "an", "the", "and", "of", "to", "in", "on", "my", "me", "i", "you", "it", "is"]);

  function clean(s) {
    return String(s)
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .replace(/\s[-–—]\s.*$/, "")                 // "Song - Remastered 2011"
      .replace(/[([{].*?[)\]}]/g, " ")             // "(feat. X)", "[Live]"
      .replace(/\b(feat|ft|featuring)\b.*$/, " ")
      .replace(/&/g, " and ")
      .replace(/['’`]/g, "")                       // don't -> dont
      .replace(/[^a-z0-9]+/g, " ")
      .trim()
      .replace(/^the /, "");
  }

  // Edit distance where swapping two neighbouring letters counts as one typo.
  function distance(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i, ...Array(b.length).fill(0)]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + cost);
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
    return d[a.length][b.length];
  }

  // How many typos a word of this length can have.
  const allowed = len => (len <= 3 ? 0 : len <= 5 ? 1 : Math.floor(len * 0.25));
  const close = (a, b) => distance(a, b) <= allowed(Math.max(a.length, b.length));

  // Returns "exact", "close" or false.
  function check(guess, answer) {
    const g = clean(guess), a = clean(answer);
    if (!g || !a) return false;
    if (g === a) return "exact";
    if (close(g.replace(/ /g, ""), a.replace(/ /g, ""))) return "close";

    const aw = a.split(" "), gw = g.split(" ");
    const key = aw.filter(w => !minor.has(w));
    const needed = key.length ? key : aw;            // judge on the meaningful words
    const hit = needed.filter(w => gw.some(x => close(w, x))).length;
    const coverage = hit / needed.length;
    const usedGuess = gw.filter(x => aw.some(w => close(w, x))).length / gw.length;

    // Short names need every key word; longer ones need most of them.
    const enough = needed.length <= 2 ? coverage === 1 : coverage >= 0.6;
    return enough && usedGuess >= 0.5 ? "close" : false;
  }

  // One phrase for both parts, e.g. "blinding lights by the weeknd", "the weeknd blinding lights",
  // or just one of them. Tries every way of splitting the words and keeps the best reading.
  function checkBoth(texts, title, artist) {
    let best = { title: false, artist: false }, bestScore = -1;
    const consider = (t, a) => {
      const r = { title: check(t, title), artist: check(a, artist) };
      const score = (r.title ? 10 : 0) + (r.artist ? 10 : 0) + (r.title === "exact") + (r.artist === "exact");
      if (score > bestScore) { bestScore = score; best = r; }
    };
    for (const raw of texts) {
      const text = String(raw).replace(/^\s*(i think|i guess|maybe|is it|it'?s|its|this is|that'?s)\b\s*/i, "");
      const words = text.trim().split(/\s+/).filter(Boolean);
      consider(text, text);
      for (let i = 1; i < words.length; i++) {
        let left = words.slice(0, i), right = words.slice(i);
        if (/^by$/i.test(right[0])) right = right.slice(1);
        if (/^by$/i.test(left[left.length - 1])) left = left.slice(0, -1);
        if (!left.length || !right.length) continue;
        consider(left.join(" "), right.join(" "));
        consider(right.join(" "), left.join(" "));
      }
    }
    return best;
  }

  return { checkBoth };
})();

/* ============================================================
   VOICE — speech-to-text through the browser (Chrome, Edge, Safari).
   ============================================================ */
const Voice = (() => {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const problems = {
    "not-allowed": "Microphone access is blocked. Allow it for this page, or type your answer.",
    "service-not-allowed": "Microphone access is blocked. Allow it for this page, or type your answer.",
    "audio-capture": "No microphone found. Type your answer instead.",
    "network": "Voice answers need an internet connection. Type your answer instead.",
    "no-speech": "Didn't catch that. Tap the mic and try again.",
  };
  let active = null;

  function stop() {
    if (!active) return;
    const r = active;
    active = null;
    r.onend = r.onresult = r.onerror = null;
    r.abort();
  }

  // onText(interim), onDone(alternatives[]), onError(message), onEnd()
  function listen({ onText, onDone, onError, onEnd }) {
    stop();
    const r = new SR();
    active = r;
    r.lang = "en-US";
    r.interimResults = true;
    r.maxAlternatives = 5;
    r.continuous = false;
    r.onresult = e => {
      const result = e.results[e.results.length - 1];
      if (result.isFinal) onDone(Array.from(result, alt => alt.transcript.trim()).filter(Boolean));
      else onText(result[0].transcript);
    };
    r.onerror = e => { if (e.error !== "aborted") onError(problems[e.error] || "Voice stopped working. Type your answer instead."); };
    r.onend = () => { active = null; onEnd(); };
    try { r.start(); } catch (_) { active = null; onError("Couldn't start the microphone. Type your answer instead."); onEnd(); }
  }

  return { supported: Boolean(SR), listen, stop };
})();

/* ============================================================
   STATS STORE — per-player stats kept in this browser.
   Swap for a server later without touching the UI.
   ============================================================ */
const StatsStore = (() => {
  const KEY = "ntt-stats";
  const blank = () => ({ name: "", games: 0, multiGames: 0, wins: 0, correct: 0, attempts: 0, streak: 0, bestStreak: 0, guessMs: 0, guesses: 0 });
  const id = name => name.trim().toLowerCase();

  function load() {
    try { return JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (_) { return {}; }
  }
  function save(all) {
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (_) { /* storage unavailable */ }
  }
  function entry(all, name) {
    return (all[id(name)] = Object.assign(blank(), all[id(name)], { name }));
  }

  return {
    recordTurn(name, results, ms) {
      const all = load();
      const s = entry(all, name);
      for (const right of results) {
        s.attempts++;
        if (right) { s.correct++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); }
        else s.streak = 0;
      }
      if (ms > 0) { s.guessMs += ms; s.guesses++; }
      save(all);
    },
    recordGame(players, winners) {
      const all = load();
      for (const p of players) {
        const s = entry(all, p.name);
        s.games++;
        if (players.length > 1) {
          s.multiGames++;
          if (winners.includes(p.name)) s.wins++;
        }
      }
      save(all);
    },
    list() {
      return Object.values(load()).sort((a, b) => b.games - a.games || b.attempts - a.attempts);
    },
  };
})();

/* ============================================================
   GAME RULES — pure logic, no DOM.
   ============================================================ */
const Rules = {
  rounds: 5,
  pointsPerPart: 10,
  minPool: 12,
  pointsFor(round) { return this.pointsPerPart * (round === this.rounds ? 2 : 1); },
};

function shuffle(list) {
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// One song per turn, no repeats until the pool runs out.
function buildQueue(pool, count) {
  let queue = [];
  while (queue.length < count) queue = queue.concat(shuffle(pool));
  return queue.slice(0, count);
}


/* ============================================================
   LOOK & FEEL — icons, accent colors, player colors.
   ============================================================ */
const ICONS = {
  top: '<path d="M12 2.5s5 4.4 5 9.8a5 5 0 0 1-10 0c0-2.6 1.4-4.2 2.5-5.1.3 1.9 1.2 3 2.5 3.1V2.5z"/>',
  "2010s": '<path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  "2000s": '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 6a6 6 0 0 0-6 6"/>',
  "90s": '<rect x="2.5" y="5" width="19" height="14" rx="2"/><circle cx="8.5" cy="11" r="2"/><circle cx="15.5" cy="11" r="2"/><path d="M10.5 11h3M6.5 19l1.5-3.5h8l1.5 3.5"/>',
  "80s": '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 5.5a6.5 6.5 0 0 1 6.5 6.5"/>',
  "70s": '<circle cx="12" cy="13.5" r="7"/><path d="M12 2.5v4M5 13.5h14M12 6.5c-2.4 2-2.4 12 0 14M12 6.5c2.4 2 2.4 12 0 14M6.4 10h11.2M6.4 17h11.2"/>',
  "60s": '<rect x="3" y="8.5" width="18" height="11.5" rx="2"/><path d="M7 8.5l9-5"/><circle cx="9" cy="14.25" r="3"/><path d="M15 12.5h3M15 16h3"/>',
  all: '<path d="M3 7h3c5 0 7 10 12 10h3M3 17h3c2 0 3.2-1.5 4.3-3.3M13.7 10.3C14.8 8.5 16 7 18 7h3M18 4l3 3-3 3M18 14l3 3-3 3"/>',
  pop: '<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>',
  rock: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  hiphop: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
  rnb: '<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  country: '<path d="M3 15c3 3 15 3 18 0M7 15c0-5 1-9 3-9 1 0 1.5 1 2 1s1-1 2-1c2 0 3 4 3 9"/>',
  dance: '<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/>',
  latin: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/>',
  palette: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="14.5" cy="7" r="1"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
  skip: '<path d="M5 4l10 8-10 8z"/><path d="M19 5v14"/>',
  send: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7"/>',
  cross: '<path d="M6 6l12 12M18 6L6 18"/>',
  stats: '<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
  replay: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
};
const icon = name => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ""}</svg>`;

// Highlight colors per era/genre: saturated mid-tones that read on light backgrounds.
const ACCENTS = {
  top: ["#00b4ff", "#ff2e88"], "2010s": ["#ff2e88", "#00b4ff"], "2000s": ["#14c27a", "#00b4ff"],
  "90s": ["#ff5a1f", "#00c2c7"], "80s": ["#ff2e88", "#ff8a00"], "70s": ["#ff9a00", "#e8b100"], "60s": ["#ff6b35", "#14c27a"],
  pop: ["#ff2e88", "#00b4ff"], rock: ["#f22b2b", "#ff9a00"], hiphop: ["#f5a300", "#ff5a1f"], rnb: ["#ff4fa3", "#ff8a00"],
  country: ["#ff9a00", "#c96a17"], dance: ["#00b4ff", "#14c27a"], latin: ["#ff5a1f", "#f5b800"],
};
const PLAYER_COLORS = ["#ff2e88", "#00a6f0", "#14b870", "#ff8a00", "#f22b2b", "#00b5b8", "#e8a700", "#3d6bff"];
// Swatch = [background, second tone, accent].
const THEMES = [
  { id: "sky", label: "Sky", dark: false, swatch: ["#ffffff", "#bfe7ff", "#1fb2ff"] },
  { id: "lemon", label: "Lemon", dark: false, swatch: ["#ffe14d", "#ffffff", "#ff2e88"] },
  { id: "bubblegum", label: "Bubblegum", dark: false, swatch: ["#fff0f7", "#ffc9e2", "#00b4ff"] },
  { id: "neon", label: "Neon", dark: true, swatch: ["#06060a", "#111118", "#ff2e88"] },
  { id: "vinyl", label: "Vinyl", dark: true, swatch: ["#16110d", "#2c221a", "#ffad1f"] },
  { id: "lagoon", label: "Lagoon", dark: true, swatch: ["#03222a", "#0b3e4a", "#19e3c7"] },
];
const playerColor = i => PLAYER_COLORS[i % PLAYER_COLORS.length];

function applyAccent() {
  document.documentElement.dataset.look = settings.look;
  const [a1, a2] = settings.genre !== "all" ? ACCENTS[settings.genre] : ACCENTS[settings.era];
  document.documentElement.style.setProperty("--a1", a1);
  document.documentElement.style.setProperty("--a2", a2);
}

/* ============================================================
   VISUALIZER — animated neon bars while a clip plays.
   ============================================================ */
const Viz = (() => {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let canvas = null, ctx = null, raf = 0, playing = false, levels = [], t = 0;

  function resize() {
    if (!canvas) return;
    const r = canvas.getBoundingClientRect(), d = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(r.width * d));
    canvas.height = Math.max(1, Math.round(r.height * d));
    draw();
  }
  function draw() {
    if (!canvas || !canvas.isConnected) return;
    const d = window.devicePixelRatio || 1, w = canvas.width, h = canvas.height;
    const bw = 5 * d, gap = 4 * d, n = Math.max(1, Math.floor((w + gap) / (bw + gap)));
    const offset = (w - (n * (bw + gap) - gap)) / 2;
    const css = getComputedStyle(document.documentElement);
    const grad = ctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, css.getPropertyValue("--a1").trim());
    grad.addColorStop(1, css.getPropertyValue("--a2").trim());
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = grad;
    ctx.shadowColor = css.getPropertyValue("--a1").trim();
    ctx.shadowBlur = playing ? 12 * d : 0;
    for (let i = 0; i < n; i++) {
      const wave = Math.abs(Math.sin(t * 0.07 + i * 0.45) * Math.sin(t * 0.029 + i * 0.13));
      const target = playing ? (reduced ? 0.25 + 0.5 * wave : 0.2 + 0.8 * wave * (0.65 + 0.35 * Math.random())) : 0.06;
      const prev = levels[i] ?? 0.06;
      levels[i] = reduced ? target : prev + (target - prev) * 0.3;
      const bh = Math.max(3 * d, levels[i] * h * 0.9);
      ctx.fillRect(offset + i * (bw + gap), (h - bh) / 2, bw, bh);
    }
  }
  function loop() {
    t++;
    draw();
    const settling = levels.some(v => v > 0.07);
    raf = (playing && !reduced) || (!playing && settling && !reduced) ? requestAnimationFrame(loop) : 0;
  }
  function kick() { if (!raf) raf = requestAnimationFrame(loop); }

  window.addEventListener("resize", resize);
  return {
    attach(c) { canvas = c; ctx = c.getContext("2d"); levels = []; resize(); },
    start() { playing = true; kick(); },
    stop() { playing = false; kick(); },
  };
})();

/* ============================================================
   SOUND EFFECTS — short chimes made in the browser (no files).
   ============================================================ */
const Sfx = (() => {
  let ctx = null;

  function unlock() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ctx) ctx = new AC();
    if (ctx.state === "suspended") ctx.resume();
  }

  function tone(freq, at, dur, { type = "triangle", gain = 0.16, slideTo = 0 } = {}) {
    if (!ctx || ctx.state !== "running") return;
    const t0 = ctx.currentTime + at;
    const osc = ctx.createOscillator(), amp = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    amp.gain.setValueAtTime(0.0001, t0);
    amp.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
    amp.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(amp).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }
  const seq = (notes, step, opts) => notes.forEach((f, i) => tone(f, i * step, step * 2.2, opts));

  return {
    unlock,
    turn() { seq([659, 880], 0.12); },
    listen() { tone(587, 0, 0.12, { type: "sine", gain: 0.2 }); tone(880, 0.09, 0.18, { type: "sine", gain: 0.2 }); },
    tick() { tone(1320, 0, 0.06, { type: "square", gain: 0.04 }); },
    right() { seq([523, 659, 784, 1047], 0.09, { gain: 0.2 }); },
    partial() { seq([523, 659], 0.12); },
    wrong() { tone(233, 0, 0.32, { type: "sawtooth", gain: 0.09, slideTo: 150 }); tone(175, 0.2, 0.42, { type: "sawtooth", gain: 0.08, slideTo: 110 }); },
    bonus() { seq([523, 659, 784, 659, 784, 1047], 0.09, { gain: 0.18 }); tone(1568, 0.55, 0.4, { type: "sine", gain: 0.12 }); },
    count() { tone(1760, 0, 0.035, { type: "square", gain: 0.03 }); },
    win() { seq([523, 523, 523, 659, 784, 659, 784, 1047], 0.13, { gain: 0.18 }); },
  };
})();

// Browsers only allow sound after a tap. Call this inside a tap so later clips can start by themselves.
const SILENCE = (() => {
  const bytes = new Uint8Array(46);
  const view = new DataView(bytes.buffer);
  const text = (o, s) => [...s].forEach((c, i) => bytes[o + i] = c.charCodeAt(0));
  text(0, "RIFF"); view.setUint32(4, 38, true); text(8, "WAVEfmt ");
  view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
  view.setUint32(24, 8000, true); view.setUint32(28, 16000, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  text(36, "data"); view.setUint32(40, 2, true);
  return URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
})();

function primeAudio() {
  Sfx.unlock();
  if (audio.paused) {
    audio.src = SILENCE;
    audio.play().catch(() => {});
  }
}


const settings = { look: "sky", era: "top", genre: "all", clip: 10, players: ["Player 1", "Player 2"] };

/* ---------- Loading ---------- */
async function startGame() {
  primeAudio();
  applyAccent();
  const era = SongSource.eras.find(e => e.id === settings.era);
  const genre = SongSource.genres.find(g => g.id === settings.genre);
  const what = [era.label, genre.id === "all" ? "" : genre.label].filter(Boolean).join(" · ");
  app.innerHTML = `
    <div class="loading">
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <p class="hint">Pulling songs for ${esc(what)}…</p>
    </div>`;

  let pool;
  try {
    pool = await SongSource.getPool({ era: settings.era, genre: settings.genre });
  } catch (err) {
    renderSetup(err.message);
    return;
  }
  if (pool.length < Rules.minPool) {
    renderSetup(`Only found ${pool.length} playable songs for ${what}. Try a different era or genre.`);
    return;
  }

  const players = settings.players.map((name, i) => ({ name, score: 0, color: playerColor(i) }));
  game = { pool, players, round: 1, turn: 0, recorded: false,
           queue: buildQueue(pool, players.length * Rules.rounds) };
  renderTurn();
}

/* ---------- Leaderboard ---------- */
const SCORE_DIGITS = 3;

function odometer(n) {
  const digits = String(n).padStart(SCORE_DIGITS, "0").split("");
  const firstReal = digits.findIndex(d => d !== "0");
  return `<span class="odo" aria-label="${n} points">${digits.map((d, i) => `
    <span class="dig ${firstReal === -1 ? (i < SCORE_DIGITS - 1 ? "lead" : "") : (i < firstReal ? "lead" : "")}">
      <span class="strip" style="--d:${d}">${"0123456789".split("").map(x => `<i>${x}</i>`).join("")}</span>
    </span>`).join("")}</span>`;
}

function leaderboard() {
  const top = Math.max(...game.players.map(p => p.score));
  return game.players.map((p, i) => `
    <div class="lb ${i === game.turn ? "now" : ""} ${top > 0 && p.score === top ? "lead-player" : ""}" id="lb-${i}" style="--pc:${p.color}">
      <span class="dot"></span><span class="nm">${esc(p.name)}</span>${odometer(p.score)}
    </div>`).join("");
}

// Roll one player's score up to its new value, odometer style.
function rollScore(index, from, to) {
  const row = document.getElementById(`lb-${index}`);
  if (!row) return;
  const pop = document.createElement("span");
  pop.className = "pop";
  pop.textContent = `+${to - from}`;
  row.appendChild(pop);
  setTimeout(() => pop.remove(), 1600);

  const next = String(to).padStart(SCORE_DIGITS, "0").split("");
  const firstReal = next.findIndex(d => d !== "0");
  row.querySelectorAll(".dig").forEach((dig, i) => {
    dig.classList.toggle("lead", i < firstReal);
    dig.querySelector(".strip").style.setProperty("--d", next[i]);
  });
  row.querySelector(".odo").setAttribute("aria-label", `${to} points`);
  row.classList.add("scored");
  for (let i = 0; i < 6; i++) setTimeout(() => Sfx.count(), 120 + i * 110);
  const top = Math.max(...game.players.map(p => p.score));
  document.querySelectorAll(".lb").forEach((el, i) => el.classList.toggle("lead-player", top > 0 && game.players[i].score === top));
}

/* ---------- Turn ---------- */
const REPLAYS = 2;
const COMMANDS = {
  skip: /^(skip|skip it|pass|next|i don'?t know|no idea|give up)$/i,
  again: /^(play (it|that)? ?again|again|repeat|replay|one more time|play it one more time)$/i,
};

function renderTurn() {
  stopClip();
  const player = game.players[game.turn];
  const song = game.queue[(game.round - 1) * game.players.length + game.turn];
  const pts = Rules.pointsFor(game.round);
  const isFinal = game.round === Rules.rounds;
  let replaysLeft = REPLAYS;
  let played = false;
  let firstPlayAt = 0;
  let locked = false;

  app.innerHTML = `
    ${topbar(`<span class="round-pill">Round ${game.round}/${Rules.rounds}</span>`)}
    <div class="board" id="board">${leaderboard()}</div>

    <section class="turn-head" style="--pc:${player.color}">
      <span class="round-pill">Your turn · ${pts} + ${pts} pts</span>
      <div class="turn-name">${esc(player.name)}</div>
      ${isFinal ? `<span class="double">Bonus round · double points</span>` : ""}
    </section>

    <div class="deck">
      <button class="clip-btn" id="clip" aria-label="Play the clip">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--a1)"></stop><stop offset="1" style="stop-color:var(--a2)"></stop>
          </linearGradient></defs>
          <circle class="track" cx="50" cy="50" r="46"></circle>
          <circle class="bar" id="ring-bar" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
        </svg>
        <span class="disc" id="disc"></span>
      </button>
      <canvas class="viz" id="viz" aria-hidden="true"></canvas>
      <div class="pills">
        <button class="pill" id="again">${icon("replay")} Play again <span class="count-badge" id="replays">${REPLAYS}</span></button>
        <button class="pill" id="skip">${icon("skip")} Skip</button>
      </div>
    </div>

    <section class="answer" id="answer">
      <button class="mic" id="mic" aria-label="Answer out loud" ${Voice.supported ? "" : "disabled"}>${icon("mic")}</button>
      <p class="mic-status" id="mic-status" aria-live="polite">${Voice.supported
        ? "The mic opens when the clip ends. Say the song and the artist."
        : "Voice isn't available in this browser. Type your answer below."}</p>
      <form class="type-row" id="type-form" autocomplete="off">
        <input class="typed" id="typed" placeholder="Or type: song by artist" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Type your answer">
        <button class="send" aria-label="Submit answer">${icon("send")}</button>
      </form>
    </section>

    <section id="result" hidden></section>
    <p class="hint center" id="audio-error" hidden></p>
  `;
  wireTopbar();
  Viz.attach(document.getElementById("viz"));

  const clipBtn = document.getElementById("clip");
  const ringBar = document.getElementById("ring-bar");
  const disc = document.getElementById("disc");
  const againBtn = document.getElementById("again");
  const skipBtn = document.getElementById("skip");
  const mic = document.getElementById("mic");
  const status = document.getElementById("mic-status");
  const typed = document.getElementById("typed");

  const idleDisc = label => {
    disc.innerHTML = `<span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>${label}</span>`;
    ringBar.setAttribute("stroke-dashoffset", "0");
  };
  const updateReplays = () => {
    document.getElementById("replays").textContent = replaysLeft;
    againBtn.disabled = locked || replaysLeft === 0 || !played;
  };
  idleDisc("PLAY CLIP");
  updateReplays();

  function play() {
    stopClip();
    audio.src = song.preview;
    audio.currentTime = 0;
    audio.play().then(() => {
      document.getElementById("audio-error").hidden = true;
      if (!played) { played = true; firstPlayAt = performance.now(); updateReplays(); }
      clipBtn.classList.add("playing");
      Viz.start();
      status.textContent = Voice.supported ? "Listen… the mic opens when the clip ends." : "Listen, then type your answer below.";
      let shown = -1;
      const tick = () => {
        const t = audio.currentTime;
        const secs = Math.ceil(Math.max(0, settings.clip - t));
        ringBar.setAttribute("stroke-dashoffset", String(Math.min(100, (t / settings.clip) * 100)));
        if (secs !== shown) {
          shown = secs;
          disc.innerHTML = `<span class="count">${secs}</span>`;
          if (secs > 0 && secs <= 3) Sfx.tick();
        }
        if (t >= settings.clip || audio.ended) {
          stopClip();
          idleDisc(replaysLeft ? "REPLAY" : "NO REPLAYS");
          if (!locked) listen();
        } else clipFrame = requestAnimationFrame(tick);
      };
      clipFrame = requestAnimationFrame(tick);
    }).catch(() => {
      idleDisc("PLAY CLIP");
      const msg = document.getElementById("audio-error");
      msg.hidden = false;
      msg.textContent = played ? "This clip wouldn't play. Tap the circle to try again." : "Tap the circle to start the clip.";
    });
  }

  function replay() {
    if (locked || !played) return;
    if (replaysLeft === 0) { status.textContent = "No replays left. Say the song and the artist."; listen(); return; }
    replaysLeft--;
    updateReplays();
    play();
  }

  function listen() {
    if (!Voice.supported || locked) return;
    stopClip();
    Sfx.listen();
    mic.classList.add("listening");
    status.textContent = "Listening… say the song and the artist.";
    let heardSomething = false;
    Voice.listen({
      onText: text => { status.innerHTML = `Heard: <b>${esc(text)}</b>`; },
      onDone: alternatives => { heardSomething = true; handleHeard(alternatives); },
      onError: message => { status.textContent = message; },
      onEnd: () => {
        mic.classList.remove("listening");
        if (!heardSomething && !locked && /^Listening|^Heard/.test(status.textContent)) {
          status.textContent = "Didn't catch that. Tap the mic to answer, or type below.";
        }
      },
    });
  }

  // Answers first, so a song actually called "Play It Again" still counts.
  function handleHeard(texts) {
    const result = Matcher.checkBoth(texts, song.title, song.artist);
    if (result.title || result.artist) return judge(result, texts[0]);
    const said = texts.map(t => t.trim().replace(/[.!?]+$/, ""));
    if (said.some(t => COMMANDS.skip.test(t))) return skip();
    if (said.some(t => COMMANDS.again.test(t))) return replay();
    judge(result, texts[0]);
  }

  function skip() {
    if (locked) return;
    judge({ title: false, artist: false }, "", true);
  }

  function judge(result, heard, skipped = false) {
    if (locked) return;
    locked = true;
    stopClip();
    const ms = firstPlayAt && !skipped ? performance.now() - firstPlayAt : 0;
    const titleRight = Boolean(result.title), artistRight = Boolean(result.artist);
    const earned = (titleRight ? pts : 0) + (artistRight ? pts : 0);
    const before = player.score;
    player.score += earned;
    StatsStore.recordTurn(player.name, [titleRight, artistRight], ms);

    if (titleRight && artistRight) Sfx.right();
    else if (titleRight || artistRight) Sfx.partial();
    else Sfx.wrong();

    document.getElementById("answer").hidden = true;
    clipBtn.disabled = true;
    ringBar.setAttribute("stroke-dashoffset", "0");
    if (song.cover) disc.innerHTML = `<img src="${esc(song.cover)}" alt="">`;
    updateReplays();
    skipBtn.disabled = true;
    showResult(song, { titleRight, artistRight, result, heard, skipped, earned });
    if (earned) setTimeout(() => rollScore(game.turn, before, player.score), 350);
  }

  clipBtn.onclick = () => { if (!played) play(); else replay(); };
  againBtn.onclick = replay;
  skipBtn.onclick = skip;
  mic.onclick = () => {
    if (mic.classList.contains("listening")) {
      Voice.stop();
      mic.classList.remove("listening");
      status.textContent = "Stopped. Tap the mic to answer.";
    } else listen();
  };
  document.getElementById("type-form").onsubmit = e => {
    e.preventDefault();
    const text = typed.value.trim();
    if (text) handleHeard([text]);
  };

  if (isFinal) Sfx.bonus(); else Sfx.turn();
  setTimeout(play, isFinal ? 900 : 500);
}

function showResult(song, r) {
  const player = game.players[game.turn];
  const lastTurn = game.turn === game.players.length - 1;
  const lastRound = game.round === Rules.rounds;
  const nextName = lastTurn ? (lastRound ? null : game.players[0].name) : game.players[game.turn + 1].name;
  const line = (label, ok, verdict, answer) =>
    `<li class="${ok ? "ok" : "no"}">${icon(ok ? "check" : "cross")}<span><b>${label}</b> ${ok ? (verdict === "exact" ? "Nailed it" : "Close enough") : r.skipped ? "Skipped" : "Missed"}${ok && verdict === "exact" ? "" : ` · ${esc(answer)}`}</span></li>`;

  const box = document.getElementById("result");
  box.hidden = false;
  box.className = "result";
  box.innerHTML = `
    <div class="earned ${r.earned ? "" : "zero"}">${r.earned ? `+${r.earned} for ${esc(player.name)}` : r.skipped ? "Skipped" : "No points this time"}</div>
    <div class="song">
      ${song.cover ? `<img src="${esc(song.cover)}" alt="" width="80" height="80">` : ""}
      <div class="meta">
        <span class="section-title">It was</span>
        <span class="t">${esc(song.title)}</span>
        <span class="a">${esc(song.artist)}</span>
      </div>
    </div>
    <ul class="verdicts">
      ${line("Song", r.titleRight, r.result.title, song.title)}
      ${line("Artist", r.artistRight, r.result.artist, song.artist)}
    </ul>
    ${r.heard ? `<p class="hint">You said: “${esc(r.heard)}”</p>` : ""}
    <button class="cta" id="next">${nextName ? `Pass to ${esc(nextName)}` : "See final scores"}</button>
  `;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  document.getElementById("next").onclick = () => {
    primeAudio();
    if (!nextName) return renderFinal();
    if (lastTurn) { game.round += 1; game.turn = 0; } else { game.turn += 1; }
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderTurn();
  };
}

/* ---------- Final ---------- */
function renderFinal() {
  stopClip();
  const ranked = game.players.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter(p => p.score === top).map(p => p.name);
  if (!game.recorded) { StatsStore.recordGame(game.players, winners); game.recorded = true; }
  const headline = winners.length > 1 ? "It's a tie!" : `${winners[0]} wins!`;

  app.innerHTML = `
    ${topbar(`<span class="round-pill">Game over</span>`)}
    <section class="turn-head">
      <span class="round-pill">Final scores</span>
      <h1 class="marquee-text" style="font-size:clamp(34px,10vw,54px)">${esc(headline)}</h1>
    </section>
    <ol class="standings">
      ${ranked.map((p, i) => `<li style="--pc:${p.color}"><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></li>`).join("")}
    </ol>
    <div class="actions">
      <button class="ghost-btn" id="setup">Change settings</button>
      <button class="cta" id="rematch">Rematch</button>
    </div>
  `;
  wireTopbar();
  Sfx.win();
  document.getElementById("rematch").onclick = startGame;
  document.getElementById("setup").onclick = () => renderSetup();
}

/* ---------- Stats drawer ---------- */
function openStats(selected) {
  stopClip();
  const all = StatsStore.list();
  const current = (game ? game.players.map(p => p.name) : settings.players).map(n => n.trim().toLowerCase());
  const chosen = all.find(s => s.name.toLowerCase() === (selected || "").toLowerCase())
    || all.find(s => current.includes(s.name.toLowerCase()))
    || all[0];

  const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "—");
  const stat = (num, lbl) => `<div class="stat"><span class="num">${num}</span><span class="lbl">${lbl}</span></div>`;

  statsDialog.innerHTML = `
    <div class="drawer-inner">
      <div class="drawer-head">
        <h2 class="marquee-text" id="stats-title">Stats</h2>
        <button class="small-btn" id="close-stats">Close</button>
      </div>
      ${chosen ? `
        <div class="who">${all.map(s => `<button class="tile" data-who="${esc(s.name)}" aria-pressed="${s === chosen}">${esc(s.name)}</button>`).join("")}</div>
        <div class="stat-grid">
          ${stat(chosen.games, "Games played")}
          ${stat(pct(chosen.wins, chosen.multiGames), "Win rate")}
          ${stat(pct(chosen.correct, chosen.attempts), "Guess accuracy")}
          ${stat(chosen.streak, "Current streak")}
          ${stat(chosen.bestStreak, "Best streak")}
          ${stat(chosen.guesses ? `${(chosen.guessMs / chosen.guesses / 1000).toFixed(1)}s` : "—", "Avg guess speed")}
        </div>
        <p class="hint">Streaks count correct answers in a row. Win rate counts games with 2 or more players. Stats are saved on this device.</p>
      ` : `<p class="hint">No stats yet. Finish a turn and each player's accuracy, streaks and speed show up here.</p>`}
    </div>`;

  document.getElementById("close-stats").onclick = () => statsDialog.close();
  statsDialog.querySelectorAll("[data-who]").forEach(b => b.onclick = () => openStats(b.dataset.who));
  if (!statsDialog.open) statsDialog.showModal();
}
statsDialog.addEventListener("click", e => { if (e.target === statsDialog) statsDialog.close(); });

renderSetup();
</script>
