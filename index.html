    panel.hidden = !isOpen;
    if (isOpen && service.prepare) service.prepare().catch(() => {});
    if (isOpen && !filled) { filled = true; service.connected() ? showLibrary() : showConnect(); }
  };
  toggle.onclick = () => open(panel.hidden);
  if (toggle.dataset.open === "true") open(true);
}

function wireCategories() {
  app.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => selectChoice({ type: "category", id: b.dataset.cat }));
  app.querySelectorAll("[data-scroll]").forEach(b => b.onclick = () => {
    const row = document.getElementById(`row-${b.dataset.scroll}`);
    row.scrollBy({ left: Number(b.dataset.dir) * row.clientWidth * 0.8, behavior: "smooth" });
  });
  // Bring the picked card into view inside its row.
  const picked = app.querySelector('[data-cat][aria-pressed="true"]');
  if (picked) picked.parentElement.scrollLeft = picked.offsetLeft - picked.parentElement.offsetLeft - 8;

  // Load card art as cards scroll into view, a few at a time.
  const queue = [];
  let running = 0;
  const pump = () => {
    while (running < 3 && queue.length) {
      const card = queue.shift();
      running++;
      SongSource.peek(card.dataset.cat).then(info => fillCard(card, info)).catch(() => {})
        .finally(() => { running--; pump(); });
    }
  };
  const watcher = new IntersectionObserver(entries => entries.forEach(e => {
    if (!e.isIntersecting) return;
    watcher.unobserve(e.target);
    queue.push(e.target);
    pump();
  }), { rootMargin: "0px 200px" });
  app.querySelectorAll("[data-cat]").forEach(card => watcher.observe(card));
}

function fillCard(card, info) {
  if (!card.isConnected) return;
  const id = card.dataset.cat;
  const art = card.querySelector(".cat-art");
  const sub = card.querySelector(".cat-sub");
  if (info.artists.length) sub.textContent = `${info.artists.join(", ")} and more`;
  const photo = DECADE_PHOTOS[id];
  const reveal = el => { art.insertBefore(el, art.querySelector(".cat-label")); requestAnimationFrame(() => el.classList.add("on")); };
  if (photo) {
    const img = new Image();
    img.className = "cat-img";
    img.alt = "";
    img.onload = () => reveal(img);
    img.src = `https://unsplash.com/photos/${photo}/download?w=400`;
  } else if (info.covers.length === 4) {
    const grid = document.createElement("span");
    grid.className = "cat-img mosaic";
    let ready = 0;
    grid.innerHTML = info.covers.map(u => `<img src="${esc(u)}" alt="">`).join("");
    grid.querySelectorAll("img").forEach(img => img.onload = () => { if (++ready === 4) reveal(grid); });
  }
}

/* ---------- Artists ---------- */
function wireArtists(startOpen) {
  const toggle = document.getElementById("artists-toggle");
  const panel = document.getElementById("artists-panel");
  const row = document.getElementById("artist-row");
  const hint = document.getElementById("artist-hint");
  const input = document.getElementById("artist-q");
  let loadedOnce = false, searchTimer = 0, latest = 0;

  const card = a => `
    <button class="artist" data-artist="${esc(a.id)}" aria-pressed="${settings.choice.type === "artist" && settings.choice.id === a.id}">
      <span class="artist-pic">${a.picture ? `<img src="${esc(a.picture)}" alt="" loading="lazy">` : esc(a.name[0] || "?")}<span class="tick">${icon("check")}</span></span>
      <span class="artist-name">${esc(a.name)}</span>
    </button>`;

  function show(list, label) {
    const picked = settings.choice.type === "artist" ? settings.choice : null;
    if (picked && !list.some(a => a.id === picked.id) && !input.value.trim()) list = [picked, ...list];
    hint.textContent = list.length ? label : "No artists found. Try another spelling.";
    row.innerHTML = list.map(card).join("");
    row.querySelectorAll("[data-artist]").forEach((b, i) => b.onclick = () =>
      selectChoice({ type: "artist", id: list[i].id, name: list[i].name, picture: list[i].picture }));
  }

  async function load(q) {
    const ticket = ++latest;
    hint.textContent = q ? `Searching for “${q}”…` : "Loading popular artists…";
    try {
      const list = q ? await SongSource.searchArtists(q) : await SongSource.topArtists();
      if (ticket === latest) show(list, q ? `Results for “${q}”` : "Popular right now");
    } catch (err) {
      if (ticket === latest) hint.textContent = err.message;
    }
  }

  const open = isOpen => {
    toggle.setAttribute("aria-expanded", String(isOpen));
    panel.hidden = !isOpen;
    if (isOpen && !loadedOnce) { loadedOnce = true; load(""); }
  };
  toggle.onclick = () => open(panel.hidden);
  input.oninput = () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => load(input.value.trim()), 350);
  };
  document.getElementById("artist-search").onsubmit = e => {
    e.preventDefault();
    clearTimeout(searchTimer);
    load(input.value.trim());
    input.blur();
  };
  if (startOpen) open(true);
}

function readNames() {
  settings.players = settings.players.map((n, i) => {
    const el = document.getElementById(`player-${i}`);
    return el ? el.value : n;
  });
}

function renderPlayerTiles(focusIndex = -1) {
  const box = document.getElementById("players");
  const n = settings.players.length;
  box.innerHTML = settings.players.map((p, i) => `
    <div class="ptile" style="--pc:${playerColor(i)}">
      <span class="avatar" id="avatar-${i}">${esc((p.trim()[0] || "?").toUpperCase())}</span>
      <input id="player-${i}" value="${esc(p)}" maxlength="18" aria-label="Player ${i + 1} name" autocomplete="off">

/* ---------- Loading ---------- */
async function startGame() {
  primeAudio();
  applyAccent();
  const choice = settings.choice;
  const what = choice.type === "category" ? SongSource.categories.find(c => c.id === choice.id).label : choice.name;
  const need = settings.players.length * Rules.rounds;
  app.innerHTML = `
    <div class="loading">
      <div class="eq" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <p class="hint" id="load-msg">Pulling songs for ${esc(what)}…</p>
    </div>`;

  let pool;
  try {
    pool = await SongSource.getPool(choice, {
      need,
      wellKnown: settings.wellKnown,
      onProgress: (n, total) => { const m = document.getElementById("load-msg"); if (m) m.textContent = `Finding your songs… ${n} of ${total}`; },
    });
  } catch (err) {
    renderSetup(err.message);
    return;
  }
  // One song per turn, so every turn gets a different song.
  if (pool.length < need) {
    const people = settings.players.length;
    renderSetup(`Only found ${pool.length} playable song${pool.length === 1 ? "" : "s"} in ${what}, and ${people} player${people === 1 ? "" : "s"} need ${need} (${Rules.rounds} each). Pick something bigger or play with fewer people.`);
    return;
  }

  ScreenAwake.on();
  const players = settings.players.map((name, i) => ({ name, score: 0, color: playerColor(i) }));
  game = { pool, players, round: 1, turn: 0, recorded: false, artistMode: choice.type === "artist", mode: settings.mode, history: [], label: what,
           queue: buildQueue(pool, players.length * Rules.rounds) };

  // Heardle turns start when the player taps play, so there's nothing to count down to.
  if (game.mode === "heardle") return renderTurn();

  // Get ready: 3-2-1 chimes, then the first turn starts with its half-second pause.
  app.innerHTML = `
    <div class="get-ready">
      <span class="round-pill">${esc(players[0].name)} is up first</span>
      <span class="big" id="go-count" aria-live="polite">3</span>
    </div>`;
  const count = document.getElementById("go-count");
  preloadClip(game.queue[0]);
  for (const n of [3, 2, 1]) {
    count.textContent = n;
    count.classList.remove("tick-in"); void count.offsetWidth; count.classList.add("tick-in");
    Sfx.countdown(n);
    // Each number shows for a full second; the clip starts as the "1" ends, well after its chime has faded.
    await new Promise(done => later(done, 1000));
  }
  renderTurn({ auto: true });
}

/* ---------- Leaderboard ---------- */
const SCORE_DIGITS = 3;

function odometer(n) {
  const digits = String(n).padStart(SCORE_DIGITS, "0").split("");
  const firstReal = digits.findIndex(d => d !== "0");
  return `<span class="odo" aria-label="${n} points">${digits.map((d, i) => `
    <span class="dig ${firstReal === -1 ? (i < SCORE_DIGITS - 1 ? "lead" : "") : (i < firstReal ? "lead" : "")}">
      <span class="strip" style="--d:${d}">${"0123456789".split("").map(x => `<i>${x}</i>`).join("")}</span>
    </span>`).join("")}</span>`;
}

function leaderboard() {
  const top = Math.max(...game.players.map(p => p.score));
  return game.players.map((p, i) => `
    <div class="lb ${i === game.turn ? "now" : ""} ${top > 0 && p.score === top ? "lead-player" : ""}" id="lb-${i}" style="--pc:${p.color}">
      <span class="dot"></span><span class="nm">${esc(p.name)}</span>${odometer(p.score)}
    </div>`).join("");
}

// Roll one player's score up to its new value, odometer style.
function rollScore(index, from, to) {
  const row = document.getElementById(`lb-${index}`);
  if (!row) return;
  const pop = document.createElement("span");
  pop.className = "pop";
  pop.textContent = `+${to - from}`;
  row.appendChild(pop);
  setTimeout(() => pop.remove(), 1600);

  const next = String(to).padStart(SCORE_DIGITS, "0").split("");
  const firstReal = next.findIndex(d => d !== "0");
  row.querySelectorAll(".dig").forEach((dig, i) => {
    dig.classList.toggle("lead", i < firstReal);
    dig.querySelector(".strip").style.setProperty("--d", next[i]);
  });
  row.querySelector(".odo").setAttribute("aria-label", `${to} points`);
  row.classList.add("scored");
  for (let i = 0; i < 6; i++) setTimeout(() => Sfx.count(), 120 + i * 110);
  const top = Math.max(...game.players.map(p => p.score));
  document.querySelectorAll(".lb").forEach((el, i) => el.classList.toggle("lead-player", top > 0 && game.players[i].score === top));
}

/* ---------- Turn ---------- */
const REPLAYS = 2;
const ANSWER_SECONDS = 15;   // per listen, so up to 45 seconds with both replays
const COMMANDS = {
  skip: /^(skip|skip it|pass|next|i don'?t know|no idea|give up)$/i,
  again: /^(play (it|that)? ?again|again|repeat|replay|one more time|play it one more time)$/i,
};

function renderTurn({ auto = false } = {}) {
  saveGame();
  if (game.mode === "heardle") return renderHeardleTurn();
  stopClip();
  clearTurnTimers();
  const player = game.players[game.turn];
  const song = game.queue[(game.round - 1) * game.players.length + game.turn];
  const pts = Rules.pointsFor(game.round);
  // In artist games everyone knows the artist, so only the title counts, worth both halves.
  const artistMode = game.artistMode;
  const titlePts = artistMode ? pts * 2 : pts;
  const ask = artistMode ? "the song" : "the song and the artist";
  const isFinal = game.round === Rules.rounds;
  let replaysLeft = REPLAYS;
  let played = false;
  let firstPlayAt = 0;
  let answerOpenedAt = 0;   // when they could first answer: the clip ended, or they tapped the mic early
  let locked = false;
  let answering = false, answerTimer = 0, micBlocked = false;

  app.innerHTML = `
    ${topbar({ right: `<span class="round-pill">Round ${game.round}/${Rules.rounds}</span>`, version: false, theme: false, stats: false })}
    <div class="board" id="board">${leaderboard()}</div>

    <section class="turn-head" style="--pc:${player.color}">
      <span class="round-pill">Your turn · ${artistMode ? `${titlePts} pts for the song` : `${pts} + ${pts} pts`}</span>
      <div class="turn-name">${esc(player.name)}</div>
      ${isFinal ? `<span class="double">Bonus round · double points</span>` : ""}
    </section>

    <div class="deck">
      <button class="clip-btn" id="clip" aria-label="Play the clip">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <defs><linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--a1)"></stop><stop offset="1" style="stop-color:var(--a2)"></stop>
          </linearGradient></defs>
          <circle class="track" cx="50" cy="50" r="46"></circle>
          <circle class="bar" id="ring-bar" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"></circle>
        </svg>
        <span class="disc" id="disc"></span>
      </button>
      <canvas class="viz" id="viz" aria-hidden="true"></canvas>
      <div class="pills">
        <button class="pill" id="again">${icon("replay")} Play again <span class="count-badge" id="replays">${REPLAYS}</span></button>
        <button class="pill" id="skip">${icon("skip")} Skip</button>
      </div>
      ${volumeControl()}
    </div>

    <section class="answer" id="answer">
      <button class="mic" id="mic" aria-label="Answer out loud" ${Voice.supported ? "" : "disabled"}>${icon("mic")}</button>
      <p class="mic-status" id="mic-status" aria-live="polite">${Voice.supported
        ? `The mic opens when the clip ends. Say ${ask}.`
        : "Voice isn't available in this browser. Type your answer below."}</p>
      <form class="type-row" id="type-form" autocomplete="off">
        <input class="typed" id="typed" placeholder="${artistMode ? "Or type the song" : "Or type: song by artist"}" autocapitalize="off" spellcheck="false" enterkeyhint="send" aria-label="Type your answer">
        <button class="send" aria-label="Submit answer">${icon("send")}</button>
      </form>
    </section>

    <section id="result" hidden></section>
    <p class="hint center" id="audio-error" hidden></p>
  `;
  wireTopbar();
  Viz.attach(document.getElementById("viz"));

  const clipBtn = document.getElementById("clip");
  const ringBar = document.getElementById("ring-bar");
  const disc = document.getElementById("disc");
  const againBtn = document.getElementById("again");
  const skipBtn = document.getElementById("skip");
  const mic = document.getElementById("mic");
  const status = document.getElementById("mic-status");
  const typed = document.getElementById("typed");

  const idleDisc = label => {
    disc.innerHTML = `<span class="play"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>${label}</span>`;
    ringBar.setAttribute("stroke-dashoffset", "0");
  };
  // A clip is busy from the tap until it ends; taps in between must not spend replays.
  let starting = false;
  const clipBusy = () => starting || clipBtn.classList.contains("playing");
  const updateReplays = () => {
    document.getElementById("replays").textContent = replaysLeft;
    againBtn.disabled = locked || replaysLeft === 0 || !played || clipBusy();
  };
  idleDisc("PLAY CLIP");
  updateReplays();

  function startAnswerTimer() {
    if (!answerOpenedAt) answerOpenedAt = performance.now();
    answering = true;
    clipBtn.classList.add("answering");
    const total = ANSWER_SECONDS * 1000, endAt = performance.now() + total;
    let shown = -1;
    answerTimer = every(() => {
      const left = Math.max(0, endAt - performance.now());
      ringBar.setAttribute("stroke-dashoffset", String(100 - (left / total) * 100));
      const secs = Math.ceil(left / 1000);
      if (secs !== shown) {
        shown = secs;
        disc.innerHTML = `<span class="answer-count"><span class="count">${secs}</span><span class="count-label">to answer</span></span>`;
        if (secs > 0 && secs <= 3) Sfx.tick();
      }
      if (left <= 0) timeUp();
    }, 100);
  }
  function stopAnswerTimer() {
    answering = false;
    clearInterval(answerTimer);
    clipBtn.classList.remove("answering");
  }
  function timeUp() {
    stopAnswerTimer();
    Voice.stop();
    judge({ title: false, artist: false }, "", false, true);
  }

  function play() {
    if (clipBusy()) return;
    stopAnswerTimer();
    stopClip();
    starting = true;
    updateReplays();
    if (audio.src !== song.preview) audio.src = song.preview;   // keep a clip preloaded during the countdown
    audio.volume = settings.volume;
    audio.currentTime = 0;
    audio.play().then(() => {
      starting = false;
      document.getElementById("audio-error").hidden = true;
      if (!played) { played = true; firstPlayAt = performance.now(); }
      clipBtn.classList.add("playing");
      updateReplays();
      Viz.start();
      status.textContent = Voice.supported ? "Listen… the mic opens when the clip ends." : "Listen, then type your answer below.";
      let shown = -1;
      const tick = () => {
        const t = audio.currentTime;
        const secs = Math.ceil(Math.max(0, settings.clip - t));
        ringBar.setAttribute("stroke-dashoffset", String(Math.min(100, (t / settings.clip) * 100)));
        if (secs !== shown) {
          shown = secs;
          disc.innerHTML = `<span class="count">${secs}</span>`;
        }
        if (t >= settings.clip || audio.ended) {
          stopClip();
          updateReplays();
          if (!locked) { startAnswerTimer(); listen(); }
        } else clipFrame = requestAnimationFrame(tick);
      };
      clipFrame = requestAnimationFrame(tick);
    }).catch(() => {
      starting = false;
      updateReplays();
      idleDisc("PLAY CLIP");
      const msg = document.getElementById("audio-error");
      msg.hidden = false;
      msg.textContent = played ? "This clip wouldn't play. Tap the circle to try again." : "Tap the circle to start the clip.";
    });
  }

  function replay() {
    if (locked || !played || clipBusy()) return;
    if (replaysLeft === 0) { status.textContent = `No replays left. Say ${ask}.`; listen(); return; }
    replaysLeft--;
    updateReplays();
    play();
  }

  function listen(quiet = false) {
    if (!Voice.supported || locked) return;
    stopClip();
    updateReplays();
    if (!quiet) Sfx.listen();
    if (!answerOpenedAt) answerOpenedAt = performance.now();
    mic.classList.add("listening");
    status.textContent = `Listening… say ${ask}.`;
    let heardSomething = false, spokeAt = 0;
    Voice.listen({
      onText: text => { if (!spokeAt) spokeAt = performance.now(); status.innerHTML = `Heard: <b>${esc(text)}</b>`; },
      onDone: alternatives => { heardSomething = true; handleHeard(alternatives, spokeAt || performance.now()); },
      onError: (message, code) => {
        if (code === "no-speech" && answering) return;   // silence: just keep listening
        if (code !== "no-speech") micBlocked = true;
        status.textContent = message;
      },
      onEnd: () => {
        mic.classList.remove("listening");
        // The browser stops listening after a pause; reopen quietly while there's time to answer.
        if (!heardSomething && !locked && answering && !micBlocked) { later(() => { if (answering && !locked) listen(true); }, 200); return; }
        if (!heardSomething && !locked && /^Listening|^Heard/.test(status.textContent)) {
          status.textContent = "Didn't catch that. Tap the mic to answer, or type below.";
        }
      },
    });
  }

  // Answers first, so a song actually called "Play It Again" still counts.
  // `at` is when they started answering (first words heard, or the moment a typed answer was sent).
  function handleHeard(texts, at = performance.now()) {
    const result = Matcher.checkBoth(texts, song.title, song.artist);
    if (result.title || result.artist) return judge(result, texts[0], false, false, at);
    const said = texts.map(t => t.trim().replace(/[.!?]+$/, ""));
    if (said.some(t => COMMANDS.skip.test(t))) return skip();
    if (said.some(t => COMMANDS.again.test(t))) return replay();
    judge(result, texts[0], false, false, at);
  }

  function skip() {
    if (locked) return;
    judge({ title: false, artist: false }, "", true);
  }

  function judge(result, heard, skipped = false, timedOut = false, at = performance.now()) {
    if (locked) return;
    locked = true;
    stopAnswerTimer();
    stopClip();
    // Guess time: from when they could answer to when they started saying it.
    const ms = heard && !skipped && !timedOut ? Math.max(0, at - (answerOpenedAt || firstPlayAt || at)) : 0;
    const titleRight = Boolean(result.title), artistRight = Boolean(result.artist);
    const earned = (titleRight ? titlePts : 0) + (!artistMode && artistRight ? pts : 0);
    const before = player.score;
    player.score += earned;

    const fullyRight = titleRight && (artistMode || artistRight);
    if (fullyRight) Sfx.right();
    else if (titleRight || (!artistMode && artistRight)) Sfx.partial();
    else Sfx.wrong();
    if (!fullyRight) {
      const answer = artistMode ? `The song was ${song.title}.` : `The song was ${song.title}, by ${song.artist}.`;
      later(() => Announcer.say(answer), 700);
    }

    document.getElementById("answer").hidden = true;
    clipBtn.disabled = true;
    ringBar.setAttribute("stroke-dashoffset", "0");
    if (song.cover) disc.innerHTML = `<img src="${esc(song.cover)}" alt="">`;
    updateReplays();
    skipBtn.disabled = true;
    showResult(song, { titleRight, artistRight, result, heard, skipped, timedOut, earned, ms, worth: { title: titlePts, artist: artistMode ? 0 : pts } });
    if (earned) later(() => rollScore(game.turn, before, player.score), 350);
  }

  clipBtn.onclick = () => { if (clipBusy()) return; if (!played) play(); else replay(); };
  againBtn.onclick = replay;
  skipBtn.onclick = skip;
  mic.onclick = () => {
    if (mic.classList.contains("listening")) {
      Voice.stop();
      mic.classList.remove("listening");
      status.textContent = answering ? "Mic off. Tap it to answer, or type below." : "Stopped. Tap the mic to answer.";
    } else listen();
  };
  document.getElementById("type-form").onsubmit = e => {
    e.preventDefault();
    const text = typed.value.trim();
    if (text) handleHeard([text]);
  };

  wireVolume();

  // After a 3-2-1 countdown (auto) the clip starts the moment the "1" ends.
  // Otherwise a chime plays first, with a short gap so it doesn't cover the song's start.
  if (isFinal) Sfx.bonus(); else if (!auto) Sfx.turn();
  // Wait two frames so the turn screen is on screen before the music starts.
  if (auto && !isFinal) requestAnimationFrame(() => requestAnimationFrame(() => { if (!locked) play(); }));
  else later(play, isFinal ? 1000 : 500);
}

function showResult(song, r) {
  const player = game.players[game.turn];
  const lastTurn = game.turn === game.players.length - 1;
  const lastRound = game.round === Rules.rounds;
  const nextName = lastTurn ? (lastRound ? null : game.players[0].name) : game.players[game.turn + 1].name;
  const line = (label, ok, verdict, answer) =>
    `<li class="${ok ? "ok" : "no"}">${icon(ok ? "check" : "cross")}<span><b>${label}</b> ${ok ? (verdict === "exact" ? "Nailed it" : verdict === "counted" ? "Counted" : "Close enough") : r.skipped ? "Skipped" : "Missed"}${ok && verdict === "exact" ? "" : ` · ${esc(answer)}`}</span></li>`;
  // Only the parts that were missed can be counted, so a misheard artist gives just the artist's points.
  const missed = r.skipped || !r.heard ? [] : ["title", "artist"].filter(part => r.worth[part] && !r[`${part}Right`]);

  const box = document.getElementById("result");
  box.hidden = false;
  box.className = "result";
  box.innerHTML = `
    <div class="earned ${r.earned ? "" : "zero"}">${r.earned ? `+${r.earned} for ${esc(player.name)}` : r.skipped ? "Skipped" : r.timedOut ? "Time's up" : "No points this time"}</div>
    ${r.ms ? `<p class="guess-time">${r.earned ? "Guessed" : "Answered"} in ${(r.ms / 1000).toFixed(1)}s</p>` : ""}
    <div class="song">
      ${song.cover ? `<img src="${esc(song.cover)}" alt="" width="80" height="80">` : ""}
      <div class="meta">
        <span class="section-title">It was</span>
        <span class="t">${esc(song.title)}</span>
        <span class="a">${esc(song.artist)}</span>
      </div>
    </div>
    <ul class="verdicts">
      ${line("Song", r.titleRight, r.result.title, song.title)}
      ${game.artistMode ? "" : line("Artist", r.artistRight, r.result.artist, song.artist)}
    </ul>
    ${r.heard ? `<p class="hint">You said: “${esc(r.heard)}”</p>` : ""}
    ${missed.length ? `
      <div class="overrule">
        <span class="hint">Mic heard it wrong?</span>
        ${missed.map(part => `<button class="pill" data-count="${part}">${icon("check")} Count ${part === "title" ? "song" : "artist"}</button>`).join("")}
      </div>` : ""}
    <button class="cta" id="next">${nextName ? `Pass to ${esc(nextName)}` : "See final scores"}</button>
    <p class="next-in" id="next-in" aria-live="polite"></p>
  `;
  box.scrollIntoView({ behavior: "smooth", block: "nearest" });
  // For when the mic mishears a name (e.g. "Laufey" as "lady"): the group can count it.
  box.querySelectorAll("[data-count]").forEach(b => b.onclick = () => {
    const part = b.dataset.count;
    Announcer.stop();
    const before = player.score;
    player.score += r.worth[part];
    r.earned += r.worth[part];
    r[`${part}Right`] = true;
    r.result = { ...r.result, [part]: "counted" };
    Sfx.right();
    showResult(song, r);
    rollScore(game.turn, before, player.score);
  });
  const go = auto => {
    autoToken++;
    game.history.push({ round: game.round, player: game.turn, song, points: r.earned, title: r.titleRight, artist: game.artistMode ? null : r.artistRight,
                        note: r.skipped ? "Skipped" : r.timedOut ? "Time's up"
                          : r.ms ? `${r.earned ? "Guessed" : "Answered"} in ${(r.ms / 1000).toFixed(1)}s` : "" });
    StatsStore.recordTurn(player.name, game.artistMode ? [r.titleRight] : [r.titleRight, r.artistRight], r.ms);
    if (!nextName) return renderFinal();
    if (lastTurn) { game.round += 1; game.turn = 0; } else { game.turn += 1; }
    window.scrollTo({ top: 0, behavior: "smooth" });
    renderTurn({ auto });
  };
  document.getElementById("next").onclick = () => { primeAudio(); go(false); };

  // Moves on by itself: wait for the answer to be read out, 3 seconds, then 3-2-1 chimes.
  const token = ++autoToken;
  const label = document.getElementById("next-in");
  const alive = () => token === autoToken;
  const wait = ms => new Promise(done => later(done, ms));
  const show = text => {
    label.innerHTML = `${text} · <button class="link-btn" id="pause-next">Pause</button>`;
    document.getElementById("pause-next").onclick = () => { autoToken++; label.textContent = "Paused. Tap the button when you're ready."; };
  };
  (async () => {
    show(nextName ? `${esc(nextName)}'s turn is coming up` : "Final scores coming up");
    await wait(900);
    while (alive() && window.speechSynthesis && speechSynthesis.speaking) await wait(200);
    await wait(3000);
    if (!alive()) return;
    if (nextName) {
      preloadClip(game.queue[(game.round - 1) * game.players.length + game.turn + 1]);
      for (const n of [3, 2, 1]) {
        if (!alive()) return;
        show(`${esc(nextName)} in ${n}`);
        Sfx.countdown(n);
        await wait(1000);
      }
    }
    if (alive()) go(true);
  })();
}

/* ---------- Heardle mode ---------- */
// Same steps as Heardle: 1, 2, 4, 7, 11 and 16 seconds. Solving on the first step is worth 6 points, the last 1.
// Getting half of it right (the artist, or the song name by the wrong artist) locks in a flat 1 point;
// the turn scores whichever is higher, the song or that point.
const HEARDLE_STEPS = [1, 2, 4, 7, 11, 16];
const HEARDLE_SQUARES = { skip: "⬛", wrong: "🟥", artist: "🟨", title: "🟨", right: "🟩", empty: "⬜" };

function renderHeardleTurn() {
  stopClip();
  clearTurnTimers();
  const player = game.players[game.turn];
  const song = game.queue[(game.round - 1) * game.players.length + game.turn];
  const tries = HEARDLE_STEPS.length, MAX = HEARDLE_STEPS[tries - 1], FULL = 30;
  const rows = [];            // { kind: "skip" | "wrong" | "artist" | "right", text }
  let step = 0, done = false, chosen = null, results = [], active = -1, searchTimer = 0, ticket = 0;
  let artistPts = 0;         // 1 point, locked in the first time they get the artist or the song name right
  let halfWhat = "";         // "the artist" or "the song name", for the result text

  app.innerHTML = `
    ${topbar({ right: `<span class="round-pill">Round ${game.round}/${Rules.rounds}</span>`, version: false, theme: false, stats: false })}
    <div class="board" id="board">${leaderboard()}</div>

    <section class="turn-head" style="--pc:${player.color}">
      <span class="round-pill">Your turn · up to ${tries} pts</span>
      <div class="turn-name">${esc(player.name)}</div>
    </section>

    <ol class="h-rows" id="h-rows" aria-label="Your guesses"></ol>

    <div class="h-player">
      <div class="h-bar" id="h-bar">
        <span class="h-unlocked" id="h-unlocked"></span>
        <span class="h-fill" id="h-fill"></span>
        ${HEARDLE_STEPS.slice(0, -1).map(t => `<i style="left:${(t / MAX) * 100}%"></i>`).join("")}
      </div>
      <div class="h-times"><span id="h-pos">0:00</span><span id="h-max">0:${String(MAX).padStart(2, "0")}</span></div>
      <div class="h-controls">
        <span></span>
        <button class="h-play" id="h-play" aria-label="Play the clip">${playIcon(false)}</button>
        <button class="pill h-step" id="h-skip"></button>
      </div>
      ${volumeControl()}
    </div>

    <section class="h-guess" id="h-guess">
      <div class="h-search">
        <ul class="h-list" id="h-list" role="listbox" hidden></ul>
        <input class="typed" id="h-q" type="search" placeholder="${game.artistMode ? "Know it? Search for the song" : "Know it? Search for the song or artist"}" autocomplete="off" autocapitalize="off" spellcheck="false"
          role="combobox" aria-expanded="false" aria-controls="h-list" aria-autocomplete="list" aria-label="Search for the song">
      </div>
      <div class="h-actions">
        <button class="pill" id="h-skip-song">Skip song</button>
        <button class="cta" id="h-submit" disabled>Submit</button>
      </div>
    </section>

    <section id="result" hidden></section>
  `;
  wireVolume();

  const bar = document.getElementById("h-bar");
  const unlocked = document.getElementById("h-unlocked");
  const fill = document.getElementById("h-fill");
  const pos = document.getElementById("h-pos");
  const playBtn = document.getElementById("h-play");
  const input = document.getElementById("h-q");
  const list = document.getElementById("h-list");
  const skipBtn = document.getElementById("h-skip");
  const submitBtn = document.getElementById("h-submit");
  const scale = () => (done ? FULL : MAX);

  // Load the clip now so even the 1-second play starts instantly.
  audio.src = song.preview;
  audio.preload = "auto";
  audio.load();

  function drawRows() {
    document.getElementById("h-rows").innerHTML = Array.from({ length: tries }, (_, i) => {
      const r = rows[i];
      if (!r) return `<li class="h-empty"></li>`;
      if (r.kind === "skip") return `<li class="h-skip">${icon("skip")}<span class="h-t">Skipped</span></li>`;
      const tag = r.kind === "artist" ? `<small>Right artist</small>` : r.kind === "title" ? `<small>Right song name</small>` : "";
      return `<li class="h-${r.kind}">${icon(r.kind === "right" ? "check" : "cross")}<span class="h-t">${esc(r.text)}</span>${tag}</li>`;
    }).join("");
  }

  function drawPlayer() {
    unlocked.style.width = `${((done ? FULL : HEARDLE_STEPS[step]) / scale()) * 100}%`;
    bar.classList.toggle("full", done);
    document.getElementById("h-max").textContent = `0:${String(scale()).padStart(2, "0")}`;
    skipBtn.hidden = done;
    if (!done) {
      const last = step === tries - 1;
      const more = last ? 0 : HEARDLE_STEPS[step + 1] - HEARDLE_STEPS[step];
      skipBtn.innerHTML = last ? "Give up" : `${icon("skip")} +${more}s`;
      skipBtn.setAttribute("aria-label", last ? "Give up" : `Skip, unlock ${more} more second${more === 1 ? "" : "s"}`);
    }
  }

  function stopPlaying() {
    cancelAnimationFrame(clipFrame);
    clipFrame = 0;
    audio.pause();
    playBtn.innerHTML = playIcon(false);
    playBtn.setAttribute("aria-label", "Play the clip");
    fill.style.width = "0";
    pos.textContent = "0:00";
  }

  function play() {
    if (clipFrame) return stopPlaying();   // the button doubles as stop, like Heardle
    const limit = done ? FULL : HEARDLE_STEPS[step];
    audio.volume = settings.volume;
    audio.currentTime = 0;
    audio.play().then(() => {
      playBtn.innerHTML = playIcon(true);
      playBtn.setAttribute("aria-label", "Stop");
      const tick = () => {
        const t = audio.currentTime;
        fill.style.width = `${(Math.min(t, limit) / scale()) * 100}%`;
        pos.textContent = `0:${String(Math.floor(Math.min(t, limit))).padStart(2, "0")}`;
        if (t >= limit || audio.ended) stopPlaying();
        else clipFrame = requestAnimationFrame(tick);
      };
      clipFrame = requestAnimationFrame(tick);
    }).catch(() => stopPlaying());
  }

  // Song search (picked from the list, like Heardle, so typos never cost a try).
  function closeList() {
    list.hidden = true;
    input.setAttribute("aria-expanded", "false");
    active = -1;
  }
  function showResults() {
    if (!results.length) { closeList(); return; }
    list.innerHTML = results.map((r, i) => `
      <li role="option" id="h-opt-${i}" aria-selected="${i === active}">
        <button type="button" data-pick="${i}" tabindex="-1">
          ${r.kind === "artist"
            ? `${r.picture ? `<img class="round" src="${esc(r.picture)}" alt="" width="36" height="36">` : `<span class="h-noart round"></span>`}
               <span class="h-txt"><b>${esc(r.name)}</b><span>Artist</span></span>`
            : `${r.cover ? `<img src="${esc(r.cover)}" alt="" width="36" height="36">` : `<span class="h-noart"></span>`}
               <span class="h-txt"><b>${esc(r.title)}</b><span>${esc(r.artist)}</span></span>`}
        </button>
      </li>`).join("");
    list.hidden = false;
    input.setAttribute("aria-expanded", "true");
    input.setAttribute("aria-activedescendant", active >= 0 ? `h-opt-${active}` : "");
    list.querySelectorAll("[data-pick]").forEach(b => {
      b.onpointerdown = e => e.preventDefault();   // keep the keyboard open on phones
      b.onclick = () => choose(results[Number(b.dataset.pick)]);
    });
  }
  function choose(r) {
    chosen = r;
    input.value = r.kind === "artist" ? r.name : `${r.title} – ${r.artist}`;
    submitBtn.disabled = false;
    closeList();
  }
  async function search(q) {
    const mine = ++ticket;
    try {
      // Up to 2 matching artists first (not in artist games, where everyone knows it), then songs.
      const [songs, artists] = await Promise.all([
        SongSource.searchSongs(q),
        game.artistMode ? [] : SongSource.searchArtists(q).catch(() => []),
      ]);
      if (mine !== ticket || done) return;
      const lower = q.toLowerCase();
      const artistHits = artists.filter(a => a && a.name && a.name.toLowerCase().includes(lower)).slice(0, 2);
      results = [...artistHits.map(a => ({ kind: "artist", name: a.name, picture: a.picture })), ...songs.slice(0, 6 - artistHits.length)];
      active = -1;
      showResults();
    } catch (_) { /* a failed search just shows nothing */ }
  }
  input.oninput = () => {
    chosen = null;
    submitBtn.disabled = true;
    clearTimeout(searchTimer);
    const q = input.value.trim();
    if (q.length < 2) { results = []; closeList(); return; }
    searchTimer = later(() => search(q), 250);
  };
  input.onkeydown = e => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      if (list.hidden || !results.length) return;
      e.preventDefault();
      active = (active + (e.key === "ArrowDown" ? 1 : -1) + results.length) % results.length;
      showResults();
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (!list.hidden && results.length) choose(results[Math.max(active, 0)]);
      else if (chosen) guess();
    } else if (e.key === "Escape") closeList();
  };
  input.onblur = () => later(closeList, 150);

  function nextStep() {
    stopPlaying();
    step++;
    drawRows();
    if (step >= tries) return finish(false);
    drawPlayer();
  }
  function skip() {
    if (done) return;
    rows.push({ kind: "skip" });
    nextStep();
  }
  function guess() {
    if (done || !chosen) return;
    const pick = chosen;
    chosen = null;
    input.value = "";
    submitBtn.disabled = true;
    closeList();
    const credit = what => { if (!artistPts) { artistPts = 1; halfWhat = what; } };
    if (pick.kind === "artist") {
      const right = Matcher.sameArtist(pick.name, song.artist);
      if (right) credit("the artist");
      rows.push({ kind: right ? "artist" : "wrong", text: right ? pick.name : `${pick.name} (artist)` });
      return nextStep();
    }
    if (pick.id === song.id || Matcher.sameSong(pick, song)) {
      rows.push({ kind: "right", text: `${pick.title} – ${pick.artist}` });
      drawRows();
      return finish(true);
    }
    const artistOnly = !game.artistMode && Matcher.sameArtist(pick.artist, song.artist);
    // Same song name by another artist (a cover, or a different song with that title).
    const titleOnly = !artistOnly && Matcher.sameTitle(pick.title, song.title);
    if (artistOnly) credit("the artist");
    if (titleOnly) credit("the song name");
    rows.push({ kind: artistOnly ? "artist" : titleOnly ? "title" : "wrong", text: `${pick.title} – ${pick.artist}` });
    nextStep();
  }

  function finish(won) {
    done = true;
    stopPlaying();
    const songPts = won ? tries - step : 0;
    const points = Math.max(songPts, artistPts);
    const artistOnlyWin = !won && artistPts > 0;
    const before = player.score;
    player.score += points;
    StatsStore.recordHeardle(player.name, { won, step, artist: artistPts > 0 });
    game.history.push({ round: game.round, player: game.turn, song, points, title: won, artist: game.artistMode ? null : won || halfWhat === "the artist",
                        note: won ? `Solved at ${HEARDLE_STEPS[step]}s` : artistPts ? `Got ${halfWhat}` : "Missed" });
    document.getElementById("h-guess").hidden = true;
    drawPlayer();
    if (won) Sfx.right();
    else {
      if (artistOnlyWin) Sfx.partial(); else Sfx.wrong();
      later(() => Announcer.say(game.artistMode ? `The song was ${song.title}.` : `The song was ${song.title}, by ${song.artist}.`), 700);
    }
    if (points) later(() => rollScore(game.turn, before, player.score), 350);

    const squares = Array.from({ length: tries }, (_, i) => HEARDLE_SQUARES[rows[i] ? rows[i].kind : "empty"]).join("");
    const shareText = `Song Quiz · Heardle\n🔊${squares}\n${won ? `Got it in ${HEARDLE_STEPS[step]}s` : artistOnlyWin ? `Got ${halfWhat}` : "Didn't get it"}\ncathero1.github.io/song-quiz`;
    const lastTurn = game.turn === game.players.length - 1;
    const nextName = lastTurn ? (game.round === Rules.rounds ? null : game.players[0].name) : game.players[game.turn + 1].name;
    // This turn is scored, so a reload should continue at the next one.
    saveGame(lastTurn ? { round: game.round + 1, turn: 0 } : { round: game.round, turn: game.turn + 1 });

    const box = document.getElementById("result");
    box.hidden = false;
    box.className = "result";
    box.innerHTML = `
      <div class="earned ${points ? "" : "zero"}">${points ? `+${points} for ${esc(player.name)}` : "Not this time"}</div>
      ${won ? `<p class="guess-time">Got it in ${HEARDLE_STEPS[step]} second${HEARDLE_STEPS[step] === 1 ? "" : "s"}</p>`
        : artistOnlyWin ? `<p class="guess-time">Got ${halfWhat}</p>` : ""}
      <div class="song">
        ${song.cover ? `<img src="${esc(song.cover)}" alt="" width="80" height="80">` : ""}
        <div class="meta">
          <span class="section-title">It was</span>
          <span class="t">${esc(song.title)}</span>
          <span class="a">${esc(song.artist)}</span>
        </div>
      </div>
      <p class="h-grid" aria-label="Result">🔊${squares}</p>
      <p class="hint center">Tap play to hear the full clip.</p>
      <div class="pills"><button class="pill" id="h-share">${icon("copy")} Copy result</button></div>
      <button class="cta" id="next">${nextName ? `Pass to ${esc(nextName)}` : "See final scores"}</button>
    `;
    box.scrollIntoView({ behavior: "smooth", block: "nearest" });

    const shareBtn = document.getElementById("h-share");
    shareBtn.onclick = () => {
      const copied = () => { shareBtn.innerHTML = `${icon("check")} Copied`; };
      const fallback = () => {
        const area = document.createElement("textarea");
        area.value = shareText;
        area.setAttribute("readonly", "");
        area.style.position = "fixed"; area.style.opacity = "0";
        document.body.appendChild(area);
        area.select();
        try { if (document.execCommand("copy")) copied(); } catch (_) {}
        area.remove();
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(shareText).then(copied, fallback);
      else fallback();
    };
    document.getElementById("next").onclick = () => {
      Sfx.unlock();
      if (!nextName) return renderFinal();
      if (lastTurn) { game.round += 1; game.turn = 0; } else { game.turn += 1; }
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderTurn();
    };
  }

  playBtn.onclick = play;
  skipBtn.onclick = skip;
  document.getElementById("h-skip-song").onclick = () => { if (!done) { stopPlaying(); finish(false); } };
  submitBtn.onclick = guess;
  drawRows();
  drawPlayer();
  Sfx.turn();
}

function playIcon(playing) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${playing ? '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/>' : '<path d="M8 5v14l11-7z"/>'}</svg>`;
}

/* ---------- Clip volume (shared by both modes) ---------- */
function volumeControl() {
  if (!volumeWorks) return "";
  const v = Math.round(settings.volume * 100);
  return `
    <label class="vol" for="vol">
      <span id="vol-icon">${icon(settings.volume ? "volume" : "mute")}</span>
      <input type="range" id="vol" min="0" max="100" step="1" value="${v}" aria-label="Clip volume" style="--v:${v}%">
    </label>`;
}
function wireVolume() {
  const vol = document.getElementById("vol");
  if (!vol) return;
  vol.oninput = () => {
    settings.volume = Number(vol.value) / 100;
    audio.volume = settings.volume;
    vol.style.setProperty("--v", `${vol.value}%`);
    document.getElementById("vol-icon").innerHTML = icon(settings.volume ? "volume" : "mute");
  };
  vol.onchange = saveSettings;
}

/* ---------- Final ---------- */
function renderFinal() {
  clearSave();
  stopClip();
  clearTurnTimers();
  ScreenAwake.off();
  const ranked = game.players.slice().sort((a, b) => b.score - a.score);
  const top = ranked[0].score;
  const winners = ranked.filter(p => p.score === top).map(p => p.name);
  if (!game.recorded) { StatsStore.recordGame(game.players, winners, game.mode); game.recorded = true; }
  const headline = winners.length > 1 ? "It's a tie!" : `${winners[0]} wins!`;

  app.innerHTML = `
    ${topbar({ version: false, theme: false })}
    <section class="turn-head">
      <span class="round-pill">Final scores</span>
      <h1 class="marquee-text" style="font-size:clamp(34px,10vw,54px)">${esc(headline)}</h1>
    </section>
    <ol class="standings">
      ${ranked.map((p, i) => `<li style="--pc:${p.color}"><span class="pos">${i + 1}</span><span class="nm">${esc(p.name)}</span><span class="pts">${p.score}</span></li>`).join("")}
    </ol>
    <div class="actions">
      <button class="ghost-btn" id="setup">Change settings</button>
      <button class="cta" id="rematch">Rematch</button>
    </div>
    ${recap()}
  `;
  wireTopbar();
  Sfx.win();
  document.getElementById("rematch").onclick = startGame;
  document.getElementById("setup").onclick = () => renderSetup();
}

// Every song of the game in order: art, song and artist with ✓/✗, and the points for that turn.
function recap() {
  if (!game.history.length) return "";
  const many = game.players.length > 1;
  const mark = ok => icon(ok ? "check" : "cross");
  const row = h => {
    const p = game.players[h.player];
    return `
      <li class="recap-row" style="--pc:${p.color}">
        ${h.song.cover ? `<img src="${esc(h.song.cover)}" alt="" width="52" height="52" loading="lazy">` : `<span class="recap-noart"></span>`}
        <div class="recap-mid">
          <span class="recap-line t ${h.title ? "ok" : "no"}">${mark(h.title)}<span>${esc(h.song.title)}</span></span>
          <span class="recap-line a ${h.artist === null ? "" : h.artist ? "ok" : "no"}">${h.artist === null ? "" : mark(h.artist)}<span>${esc(h.song.artist)}</span></span>
          ${h.note ? `<span class="recap-note">${esc(h.note)}</span>` : ""}
        </div>
        <div class="recap-right">
          <span class="recap-pts ${h.points ? "" : "zero"}">${h.points ? `+${h.points}` : "0"}</span>
          ${many ? `<span class="recap-who"><i></i>${esc(p.name)}</span>` : ""}
        </div>
      </li>`;
  };
  const rounds = [...new Set(game.history.map(h => h.round))];
  const bonus = r => (game.mode === "classic" && r === Rules.rounds ? " · double points" : "");
  return `
    <section class="recap">
      <h2 class="section-title">This game</h2>
      ${many
        ? rounds.map(r => `
            <h3 class="recap-round">Round ${r}${bonus(r)}</h3>
            <ol>${game.history.filter(h => h.round === r).map(row).join("")}</ol>`).join("")
        : `<ol>${game.history.map(row).join("")}</ol>`}
    </section>`;
}

/* ---------- Stats drawer ---------- */
let statsMode = null;   // which tab the drawer shows; starts on the mode being played

function openStats(selected, confirming = "") {
  stopClip();
  if (!statsMode) statsMode = game ? game.mode : settings.mode;
  const all = StatsStore.list();
  const current = (game ? game.players.map(p => p.name) : settings.players).map(n => n.trim().toLowerCase());
  const chosen = all.find(s => s.name.toLowerCase() === (selected || "").toLowerCase())
    || all.find(s => current.includes(s.name.toLowerCase()))
    || all[0];

  const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : "—");
  const stat = (num, lbl) => `<div class="stat"><span class="num">${num}</span><span class="lbl">${lbl}</span></div>`;

  function classicView(c) {
    return `
      <div class="stat-grid">
        ${stat(c.games, "Games played")}
        ${stat(pct(c.wins, c.multiGames), "Win rate")}
        ${stat(pct(c.correct, c.attempts), "Guess accuracy")}
        ${stat(c.streak, "Current streak")}
        ${stat(c.bestStreak, "Best streak")}
        ${stat(c.guesses ? `${(c.guessMs / c.guesses / 1000).toFixed(1)}s` : "—", "Avg guess speed")}
      </div>
      <p class="hint">Streaks count correct answers in a row. Win rate counts games with 2 or more players.</p>`;
  }
  function heardleView(h) {
    const most = Math.max(1, ...h.dist, h.missed);
    const bar = (label, n, miss = false) => `
      <div class="dist-row">
        <span class="dist-label">${label}</span>
        <span class="dist-track"><span class="dist-bar ${miss ? "miss" : ""}" style="width:${Math.max(n ? 8 : 0, (n / most) * 100)}%"></span></span>
        <span class="dist-n">${n}</span>
      </div>`;
    return `
      <div class="stat-grid">
        ${stat(h.games, "Games played")}
        ${stat(pct(h.wins, h.multiGames), "Win rate")}
        ${stat(pct(h.solved, h.songs), "Songs solved")}
        ${stat(h.streak, "Current streak")}
        ${stat(h.bestStreak, "Best streak")}
        ${stat(h.artistOnly, "Half right")}
      </div>
      <div class="dist" aria-label="Songs solved at each clip length">
        <span class="section-title">Solved at</span>
        ${HEARDLE_STEPS.map((sec, i) => bar(`${sec}s`, h.dist[i])).join("")}
        ${bar("✗", h.missed, true)}
      </div>
      <p class="hint">Streaks count songs solved in a row. "Half right" counts songs where you got the artist or the song name, but not both.</p>`;
  }
  function manage(name) {
    if (confirming === "reset") return `
      <div class="confirm"><span>Reset all of ${esc(name)}'s stats to zero?</span>
        <div class="actions"><button class="ghost-btn" data-cancel>Cancel</button><button class="cta danger" data-do="reset">Reset</button></div></div>`;
    if (confirming === "delete") return `
      <div class="confirm"><span>Delete ${esc(name)} and all their stats?</span>
        <div class="actions"><button class="ghost-btn" data-cancel>Cancel</button><button class="cta danger" data-do="delete">Delete</button></div></div>`;
    return `<p class="manage"><button class="link-btn" data-ask="reset">Reset stats</button> · <button class="link-btn" data-ask="delete">Delete player</button></p>`;
  }

  // Highest game score for this mode, out of the most a game can give, plus the record on this device.
  function bestCard(name) {
    const mine = chosen[statsMode].bestScore || 0;
    const max = statsMode === "heardle" ? Rules.rounds * HEARDLE_STEPS.length
      : (Rules.rounds - 1) * Rules.pointsPerPart * 2 + Rules.pointsFor(Rules.rounds) * 2;
    const holder = all.reduce((best, s) => ((s[statsMode].bestScore || 0) > (best ? best[statsMode].bestScore || 0 : 0) ? s : best), null);
    const rec = holder && holder[statsMode].bestScore;
    return `
      <div class="best">
        <span class="lbl">Highest score</span>
        <span class="num">${mine ? `${mine}<small> / ${max}</small>` : "—"}</span>
        <span class="rec">${!rec ? "No games finished yet" : holder.name === name ? "That's the record on this device" : `Record: ${esc(holder.name)} · ${rec}`}</span>
      </div>`;
  }

  statsDialog.innerHTML = `
    <div class="drawer-inner">
      <div class="drawer-head">
        <h2 class="marquee-text" id="stats-title">Stats</h2>
        <button class="small-btn" id="close-stats">Close</button>
      </div>
      ${chosen ? `
        <div class="who">${all.map(s => `<button class="tile" data-who="${esc(s.name)}" aria-pressed="${s.name === chosen.name}">${esc(s.name)}</button>`).join("")}</div>
        <div class="tiles two seg" role="group" aria-label="Game mode">
          <button class="tile" data-stats-mode="classic" aria-pressed="${statsMode === "classic"}">${icon("mic")}<span>Classic</span></button>
          <button class="tile" data-stats-mode="heardle" aria-pressed="${statsMode === "heardle"}">${icon("wave")}<span>Heardle</span></button>
        </div>
        ${bestCard(chosen.name)}
        ${statsMode === "heardle" ? heardleView(chosen.heardle) : classicView(chosen.classic)}
        ${manage(chosen.name)}
        <p class="hint">Stats are saved on this device.</p>
      ` : `<p class="hint">No stats yet. Finish a turn and each player's stats show up here.</p>`}
    </div>`;

  document.getElementById("close-stats").onclick = () => statsDialog.close();
  statsDialog.querySelectorAll("[data-who]").forEach(b => b.onclick = () => openStats(b.dataset.who));
  statsDialog.querySelectorAll("[data-stats-mode]").forEach(b => b.onclick = () => { statsMode = b.dataset.statsMode; openStats(chosen.name); });
  statsDialog.querySelectorAll("[data-ask]").forEach(b => b.onclick = () => openStats(chosen.name, b.dataset.ask));
  statsDialog.querySelectorAll("[data-cancel]").forEach(b => b.onclick = () => openStats(chosen.name));
  statsDialog.querySelectorAll("[data-do]").forEach(b => b.onclick = () => {
    if (b.dataset.do === "reset") { StatsStore.reset(chosen.name); openStats(chosen.name); }
    else { StatsStore.remove(chosen.name); openStats(); }
  });
  if (!statsDialog.open) statsDialog.showModal();
}
statsDialog.addEventListener("click", e => { if (e.target === statsDialog) statsDialog.close(); });
statsDialog.addEventListener("close", () => { statsMode = null; });

// Finish a Spotify login if Spotify just sent us back here, then show the setup screen.
SongSource.libraries.spotify.finishLogin().then(result => {
  if (result === "ok") openLibraryNext = "spotify";
  renderSetup(result && result !== "ok" ? result : "");
});
</script>
</body>
</html>
